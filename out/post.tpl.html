<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>@@TITLE@@ · F1lyingCat</title>
<meta name="description" content="@@DESC@@">
<meta property="og:title" content="@@TITLE@@">
<meta property="og:description" content="@@DESC@@">
<meta property="og:type" content="article">
<meta property="og:url" content="https://F1yingCat.github.io/post/@@URLENC@@">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%2314121c'/><rect x='4' y='2' width='2' height='2' fill='%23ef7c2a'/><rect x='10' y='2' width='2' height='2' fill='%23ef7c2a'/><rect x='3' y='3' width='10' height='8' fill='%23ef7c2a'/><rect x='4' y='6' width='2' height='2' fill='%2314121c'/><rect x='10' y='6' width='2' height='2' fill='%2314121c'/><rect x='6' y='9' width='4' height='4' fill='%23ef7c2a'/></svg>">
<link rel="stylesheet" href="../assets/site.css">
</head>
<!-- @@ADOPTED@@ out/adopt-posts.ps1：Gmeek 用自己的 Primer 模板生成这一页，
     这一步把它换成本站的版式。改版式请改本文件和 static/assets/ 下的同名资源，
     不要改这个标记——它是脚本判断"已经接管过、别再动"的依据。 -->
<body data-active="1"
      data-post='@@POSTJSON@@'>

<header class="hud">
  <a class="brand" id="brand" href="../index.html">F1YINGCAT</a>
  <div class="zone-name"><span class="zone-en">NOTICE BOARD</span><span>公告栏</span></div>
  <time class="clock" id="clock" aria-label="当前日期和时间"></time>
  <nav class="znav" id="znav" aria-label="区域"></nav>
</header>

<main class="page">
  <article class="post">
    <p class="kicker" id="kicker"></p>
    <h1 id="postTitle">@@TITLE@@</h1>

    <figure class="art">
      <canvas class="art" data-slug="@@SLUG@@" role="img" aria-label="像素猫插画"></canvas>
      <figcaption data-auto="1">@@ARTCAP@@</figcaption>
    </figure>

    <div class="prose">
@@BODY@@
    </div>

    <nav class="pager" id="pager" aria-label="上下篇"></nav>
  </article>

  <div class="save">
    <a href="../index.html">PATROL</a>
    <a href="../tag.html">ARCHIVE</a>
    <a href="@@ISSUE@@" target="_blank" rel="noopener">ISSUE</a>
    <span>&copy; 2026 F1lyingCat</span>
  </div>
  <div class="foot-pad"></div>
</main>

<nav class="track" id="track" aria-label="走到某一区"></nav>

<script src="../assets/posts.js"></script>
<script src="../assets/sprite.js"></script>
<script src="../assets/site.js"></script>
<script src="../assets/post.js"></script>
</body>
</html>
