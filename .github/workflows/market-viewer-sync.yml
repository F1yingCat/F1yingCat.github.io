name: Sync MarketViewer to docs

# workflow 名字保持不变：pages-deploy.yml 用 workflow_run 按名字挂在这条上，
# 改名会让部署链断掉。职责其实早就不止 MarketViewer 了，见下面的 cp 清单。

on:
  # 1. 当 static/ 下文件变化时触发（涵盖 Mavis 每天推数据）
  #    不要监听 docs/，否则 sync 自己 push 会自循环
  push:
    branches: [main]
    paths:
      - 'static/MarketViewer.html'
      - 'static/index.html'
      - 'static/tag.html'
      - 'static/post/**'
      - 'static/rss.xml'
      - 'static/assets/**'
      - 'static/data/**'

  # 2. Gmeek 跑完后触发（防止被它清空）
  workflow_run:
    workflows: ["Gmeek"]
    types: [completed]

# 防止和 Gmeek 互相等待死锁
concurrency:
  group: sync-market-viewer
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # Gmeek 失败时也同步（万一 Gmeek 跑挂了我们也保持 MarketViewer 最新）
    if: ${{ github.event_name == 'push' || github.event.workflow_run.conclusion != 'failure' }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5   # 2025-08 起 Node 24（v4 在 Node 20，会触发 deprecation warning）
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync static → docs
        run: |
          set -e
          mkdir -p docs
          # 站点门户：Gmeek 每次都会重新生成 docs/index.html（文章列表），
          # 所以必须在这一步把 static/index.html 覆盖回去，否则页面会被冲掉。
          [ -f static/index.html ] && cp static/index.html docs/index.html
          # 像素夜行那套页面：Gmeek 同样不认识，runAll 会用模板版覆盖它们。
          # 漏掉任何一条，归档页和文章页就会在下次 Gmeek 跑完（每天 16:00 UTC）
          # 悄悄退回 Primer CDN 的老样子——线上看着"没改过"，其实是每天被冲一次。
          [ -f static/tag.html ] && cp static/tag.html docs/tag.html
          [ -f static/rss.xml ] && cp static/rss.xml docs/rss.xml
          if [ -d static/post ] && ls static/post/*.html >/dev/null 2>&1; then
            mkdir -p docs/post
            cp -f static/post/*.html docs/post/
          fi
          [ -f static/MarketViewer.html ] && cp static/MarketViewer.html docs/MarketViewer.html
          [ -d static/assets ] && cp -r static/assets/. docs/assets/
          [ -d static/data ] && cp -r static/data/. docs/data/
          # 故意不同步的：static/fonts/（Gmeek 遗留，index.html 和 site.css 都把
          # 字体内嵌成 base64 了，没有一个页面引用 fonts/*.woff2，搬过去只是让
          # 部署包变大）以及 static/.sync-trigger（Mavis 的空标记文件）。
          echo "=== docs 根 ===" && ls docs/*.html docs/*.xml
          echo "=== docs/post/ ===" && ls docs/post/
          echo "=== docs/assets/ ===" && ls docs/assets/
          echo "=== docs/data/ ===" && ls docs/data/

      # 文章清单：由 out/genposts.ps1 从 blogBase.json 的 postListJson 重新生成。
      #
      # 为什么放在 static→docs 拷贝【之后】：Gmeek 刚跑完，仓库根的 blogBase.json
      # 才是最新的文章清单，先把它落到 docs/assets/posts.js，再让部署带上。
      # 放在拷贝之前会被 static/assets/ 里那份旧拷贝盖回去。
      #
      # 为什么写 docs/ 而不写 static/：这个 workflow 的 push 触发路径是 static/**，
      # 在这里往 static/ 提交会再次触发自己，无限循环。
      #
      # 内容与 static/assets/posts.js 一致，两条路都留着：仓库里那份让 file:// 也能看，
      # 这里这份保证即使仓库里那份忘了更新，部署出去的还是对的。
      - name: Regenerate posts.js
        shell: pwsh
        # 故意不让它阻断部署：这步夹在 static→docs 拷贝和 Commit & Push 之间，
        # 一旦失败，后面的提交步骤会整个被跳过，于是"生成器出 bug"会升级成
        # "整个站点不再更新"——为了一个只影响文章清单的脚本，代价太大。
        # 失败时的兜底是仓库里那份（可能稍旧的）posts.js，站点照常可用，
        # 而 run 标红、日志里能看到报错。个人博客宁可少一次自动更新，不要全停。
        continue-on-error: true
        run: |
          ./out/genposts.ps1 -Base blogBase.json -Out docs/assets/posts.js
          echo "=== generated posts.js ===" && head -c 400 docs/assets/posts.js

      - name: Commit & Push
        run: |
          git config user.name "market-viewer-bot"
          git config user.email "bot@users.noreply.github.com"
          # 关键：解决 race condition。如果连续多次 push，HEAD 可能落后于 remote
          git pull --rebase --autostash || true
          # git add 必须把上面 cp 的每一项都列全：只 commit 索引里有的文件，
          # 没 add 的改动会留在 working tree，部署出去的还是旧版。
          git add docs/MarketViewer.html docs/index.html docs/tag.html docs/rss.xml \
                  docs/post/ docs/assets/ docs/data/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            # 不要 [skip ci]！否则 Deploy Pages 也不会跑 → 用户访问看到旧版
            # 这里 sync push 不会自循环：sync 的 trigger paths 是 static/，而 sync 改的是 docs/
            git commit -m "sync: market-viewer from static"
            git push
          fi
