name: Sync MarketViewer to docs

on:
  # 1. 当 static/ 下文件变化时触发（涵盖 Mavis 每天推数据）
  #    不要监听 docs/，否则 sync 自己 push 会自循环
  push:
    branches: [main]
    paths:
      - 'static/MarketViewer.html'
      - 'static/assets/**'
      - 'static/data/**'

  # 2. Gmeek 跑完后触发（防止被它清空）
  workflow_run:
    workflows: ["Gmeek"]
    types: [completed]

# 防止和 Gmeek 互相等待死锁
concurrency:
  group: sync-market-viewer
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # Gmeek 失败时也同步（万一 Gmeek 跑挂了我们也保持 MarketViewer 最新）
    if: ${{ github.event_name == 'push' || github.event.workflow_run.conclusion != 'failure' }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync static → docs
        run: |
          set -e
          mkdir -p docs
          # 只同步 MarketViewer 相关文件，不影响 Gmeek 生成的文件
          [ -f static/MarketViewer.html ] && cp static/MarketViewer.html docs/MarketViewer.html
          [ -d static/assets ] && cp -r static/assets/. docs/assets/
          [ -d static/data ] && cp -r static/data/. docs/data/
          echo "=== docs/MarketViewer.html ===" && ls -la docs/MarketViewer.html
          echo "=== docs/assets/ ===" && ls docs/assets/
          echo "=== docs/data/ ===" && ls docs/data/

      - name: Commit & Push
        run: |
          git config user.name "market-viewer-bot"
          git config user.email "bot@users.noreply.github.com"
          # 关键：解决 race condition。如果连续多次 push，HEAD 可能落后于 remote
          git pull --rebase --autostash || true
          git add docs/MarketViewer.html docs/assets/ docs/data/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            # 不要 [skip ci]！否则 Deploy Pages 也不会跑 → 用户访问看到旧版
            # 这里 sync push 不会自循环：sync 的 trigger paths 是 static/，而 sync 改的是 docs/
            git commit -m "sync: market-viewer from static"
            git push
          fi
