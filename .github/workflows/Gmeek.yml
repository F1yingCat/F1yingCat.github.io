name: build Gmeek

on:
  workflow_dispatch:
  issues:
    types: [opened, edited]
  schedule:
    - cron: "0 16 * * *"
jobs:
  build:
    name: Generate blog
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.owner.id == github.event.sender.id || github.event_name == 'schedule' }}
    permissions: write-all
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4

      - name: Get config.json
        run: |
          echo "====== check config.josn file ======"
          cat config.json
          echo "====== check config.josn end  ======"
          sudo apt-get install jq

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.8

      - name: Clone source code
        run: |
          GMEEK_VERSION=$(jq -r ".GMEEK_VERSION" config.json)
          git clone https://github.com/Meekdai/Gmeek.git /opt/Gmeek;
          cd /opt/Gmeek/
          lastTag=$(git describe --tags `git rev-list --tags --max-count=1`)
          if [ $GMEEK_VERSION == 'last' ]; then git checkout $lastTag; else git checkout $GMEEK_VERSION; fi;

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r /opt/Gmeek/requirements.txt

      - name: Generate new html
        run: |
          cp -r ./* /opt/Gmeek/
          cd /opt/Gmeek/
          python Gmeek.py ${{ secrets.GITHUB_TOKEN }} ${{ github.repository }} --issue_number '${{ github.event.issue.number }}'
          cp -a /opt/Gmeek/docs ${{ github.workspace }}
          cp -a /opt/Gmeek/backup ${{ github.workspace }}
          cp /opt/Gmeek/blogBase.json ${{ github.workspace }}

      # 把我们手工维护的页面【立刻】放回去。
      #
      # 这一步以前不存在，于是每次编辑 issue 都会：Gmeek 用它自己的版本重写
      # docs/index.html、docs/MarketViewer.html、docs/assets/render.js、docs/data/*
      # （历史提交 6276c3c 就是这么干的），紧接着下面的 `git add . && git commit`
      # 把重置提交进去，而本文件末尾那个 deploy job 又把重置版【发上线】。
      #
      # market-viewer-sync.yml 事后能修好，但那中间有个窗口重置版是活的；
      # 更糟的是它的条件是 workflow_run.conclusion != 'failure' ——
      # Gmeek 一失败，修复也跟着跳过，重置就留下了。
      #
      # 放在这里（docs 拷贝之后、commit 和 deploy 之前），重置就永远到不了
      # git、也永远不会被发布。Gmeek 失败时本 job 直接失败，末尾的 deploy
      # 不会跑，线上保留上一次的好版本 —— 这才是安全的失败方向。
      #
      # 故意不写 continue-on-error：还原失败还继续部署，等于把重置发出去。
      #
      # 真正的通用规则：手工维护的内容一律放 static/，由本步骤和
      # market-viewer-sync.yml 共用的 out/restore-docs.sh 还原。
      # 直接手写进 docs/ 而不放进 static/ 的文件不会有人替它兜底。
      - name: Restore hand-written pages
        run: |
          bash ./out/restore-docs.sh
          echo "=== docs after restore ===" && ls docs/ && ls docs/assets/ docs/data/

      # 模板接管：把 Gmeek 用 Primer 模板生成的 docs/post/*.html 换成我们自己的版式
      # （HUD / kicker / 上下篇 / 像素猫配图）。
      #
      # 为什么必须放在本 workflow 里、而不是只靠 market-viewer-sync.yml：
      # 这个 job 末尾会自己 upload-pages-artifact 然后 deploy，也就是说它
      # 【直接发布的是 docs/ 当前的样子】。sync 是 workflow_run 触发的后置修复，
      # 在那之前有一个窗口，线上躺着的已经是 Gmeek 原版页面了。
      #
      # 同样不加 continue-on-error：接管失败还发版，等于把 Primer 页面发上线。
      # 失败时这个 job 停住，线上保留上一次的好版本。
      #
      # 幂等：被接管过的页面带 out/adopt-posts.ps1 标记，脚本会跳过；
      # Gmeek 每次重新生成它才会再次被接管，所以改 issue 里的正文照样能生效。
      - name: Adopt our template for Gmeek post pages
        shell: pwsh
        run: |
          ./out/adopt-posts.ps1 -Docs docs -Base blogBase.json -Tpl out/post.tpl.html

      # 本 workflow 的 deploy job 直接发布 docs/ 当前的样子，所以 docs/ 必须在
      # 提交前就是对的。
      #
      # 以前少了这一步：新建 issue → Gmeek 写好 blogBase.json（含新文章）→
      # restore-docs.sh 把 static/assets/posts.js 原样拷过来（还是旧的 3 篇）
      # → deploy 把这份旧清单发上线。首页公告栏和归档页都不出现新文章。
      #
      # 原本指望 market-viewer-sync.yml 的 workflow_run 事后补救，但那条触发器
      # 写的是 workflows: ["Gmeek"]，而本文件 name 是 "build Gmeek"，
      # GitHub 按 name 匹配 —— 触发器从未成立，补救从未发生。
      # （触发器名已改成 build Gmeek，但那只解决"下次"，不解决"这一次"，
      #  所以这一步必须留着，让本 workflow 自己就闭环。）
      #
      # posts.js 写 docs/ 不写 static/：本 workflow 的 push 触发路径是
      # static/**，往 static/ 提交会让 market-viewer-sync 反复自触发。
      - name: Regenerate posts.js from the fresh blogBase.json
        shell: pwsh
        run: |
          ./out/genposts.ps1 -Base blogBase.json -Out docs/assets/posts.js
          echo "=== posts.js now lists ===" && grep -c "cn:" docs/assets/posts.js

      - name: update html
        run: |
          git config --local user.email "$(jq -r ".email" config.json)"
          git config --local user.name "${{ github.repository_owner }}"
          git add .
          git commit -a -m '🎉auto update by Gmeek action' || echo "nothing to commit"
          git push || echo "nothing to push"
          sleep 3

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/.'

  deploy:
    name: Deploy blog
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
      pages: write
      id-token: write
    concurrency:
      group: "pages"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
