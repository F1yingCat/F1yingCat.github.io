name: premarket daily update

on:
  schedule:
    # 每天 UTC 00:45 (北京时间 08:45) 跑
    # 上一交易日美股数据 + 当日亚太/外汇最新数据
    # cron 语法: 分 时 日 月 周（UTC 时间）
    - cron: '45 0 * * 1-5'
  workflow_dispatch:
    # 允许在 Actions 页面手动触发立即更新

permissions:
  contents: write

concurrency:
  group: premarket
  cancel-in-progress: false

jobs:
  generate:
    name: 拉取行情并生成 premarket.html
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance requests

      - name: Run generate.py
        run: |
          cd premarket
          python generate.py --out ../docs/premarket.html

      - name: Verify output
        run: |
          test -s docs/premarket.html || (echo "ERROR: premarket.html 未生成或为空" && exit 1)
          wc -c docs/premarket.html
          head -3 docs/premarket.html

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/premarket.html docs/premarket-data.json 2>/dev/null || git add docs/premarket.html
          # 如果没有变化就跳过 commit
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          DATE=$(date -u +%Y-%m-%d)
          git commit -m "🤖 auto: premarket 速览 - ${DATE}"
          git push
