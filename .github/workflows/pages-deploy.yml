name: Deploy Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# 不设置 concurrency group，让 GitHub Pages 系统自己排队
# （之前设了 group: pages 但旧 runs 卡在 queue 里，阻塞新 run）

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs'

      - id: deployment
        name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
