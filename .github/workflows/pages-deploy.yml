name: Deploy Pages

# 触发策略：
# 1. workflow_run (Sync MarketViewer to docs)：sync 完成后自动接 deploy
#    - Mavis 改 static/data/postmarket 等文件 → sync 推 commit → 这里接 deploy
# 2. workflow_dispatch：手动重部署
#
# 不监听 push！原因：
#   - push 会同时触发 Gmeek 或 sync，sync 自己又会推一个新 commit
#   - 如果 pages-deploy 监听 push，会和 Gmeek 内置的 deploy job 重复部署，导致 race condition
#   - 现在统一走 workflow_run，Gmeek 完成后会触发 sync，sync 完成后 workflow_run 触发
#     本次 deploy，最终部署的是 sync 推的最新 docs/
#
# 不监听 Gmeek 的 workflow_run：
#   - Gmeek.yml 内部已经有 build + deploy jobs
#   - Gmeek 完成后还会触发 sync，sync 完成后 workflow_run 也会触发本次 deploy
#   - 链条已经覆盖 Gmeek 路径，多监听一次会重复

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Sync MarketViewer to docs"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

# 避免和 Gmeek deploy 撞车：同 group 内排队（不 cancel，让两者都跑完）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # workflow_run 触发时，只有 sync 成功才部署（sync 失败别部署）
    # workflow_dispatch 触发时直接跑
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5   # 2025-08 起 Node 24（v4 在 Node 20，会触发 deprecation warning）
        # workflow_run 触发时，checkout sync commit 的 head（包含 sync 推的 docs/）
        # workflow_dispatch 触发时，checkout main
        with:
          ref: >-
            ${{
              github.event_name == 'workflow_run' &&
              github.event.workflow_run.head_sha ||
              'main'
            }}

      - name: Setup Pages
        uses: actions/configure-pages@v6   # 2026-03 起 Node 24

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3   # v3 仍受官方维护，能跑 Node 24，暂不强制升级
        with:
          path: 'docs'

      - id: deployment
        name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5   # 2025-07 起 Node 24
