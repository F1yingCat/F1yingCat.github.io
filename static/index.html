       落在路沿上是在把路沿擦掉。院子左边那段落在草上，正好压住草的受光唇 */
    c.fillStyle='#1b3129'; c.fillRect(F0+2,GROUND+1,234-F0,1);
    c.fillStyle='#241f19'; c.fillRect(242,GROUND+1,F1-242,1);
    c.fillStyle='#2e2b26'; c.fillRect(242,GROUND+3,F1-242,1);
  })();

  /* ================= z1：公告栏 ================= */
  (function(){
    var bx=ZONE_W+250;
    /* 板子立在两根柱子上 */
    c.fillStyle='#3a2418'; c.fillRect(bx+10,GROUND-56,5,56); c.fillRect(bx+86,GROUND-56,5,56);
    c.fillStyle='#54392a'; c.fillRect(bx+10,GROUND-56,1,56); c.fillRect(bx+86,GROUND-56,1,56);
    /* 板面 */
    c.fillStyle='#4a3524'; c.fillRect(bx,GROUND-72,101,54);
    c.fillStyle='#5f452f'; c.fillRect(bx,GROUND-72,101,1);
    c.fillStyle='#2b1d13'; c.fillRect(bx,GROUND-19,101,2);
    /* 背面横撑 */
    c.fillStyle='#3a2418'; c.fillRect(bx+4,GROUND-44,93,2);
    /* 钉在板上的纸条——和面板里的文章一一对应 */
    var papers=[[bx+8,GROUND-66,34,20],[bx+48,GROUND-68,38,22],[bx+14,GROUND-42,30,17]];
    for(i=0;i<papers.length;i++){
      var p3=papers[i];
      c.fillStyle='#0a0810'; c.fillRect(p3[0]-1,p3[1]-1,p3[2]+2,p3[3]+2);
      c.fillStyle='#efe6d2'; c.fillRect(p3[0],p3[1],p3[2],p3[3]);
      c.fillStyle='#c9bda6';
      for(var ln=0;ln<Math.floor(p3[3]/5);ln++) c.fillRect(p3[0]+3,p3[1]+5+ln*5,p3[2]-6-Math.floor(rnd()*8),1);
      c.fillStyle=[PAL.up,PAL.azure,PAL.O][i];
      c.fillRect(p3[0]+Math.floor(p3[2]/2)-2,p3[1]-3,4,3);
    }
    /* 路灯：这条街上唯一一盏，光从它往人行道上摊开 */
    lamp(ZONE_W+90,GROUND,74,{sw:20,arm:8,r:34,r2:19});
  })();

  /* 灌木：把 z1 的街道和 z2 的桥头分开 */
  (function(){
    [[ZONE_W+470,1],[ZONE_W+520,1],[2*ZONE_W-40,1],[2*ZONE_W-96,1]].forEach(function(b){
      var x=b[0], y=GROUND;
      c.fillStyle='#16302a';
      c.fillRect(x,y-14,44,14); c.fillRect(x+5,y-21,34,8); c.fillRect(x+14,y-26,16,6);
      c.fillStyle='#20423a';
      c.fillRect(x+4,y-18,12,5); c.fillRect(x+26,y-16,10,4);
    });
  })();

  /* ================= z2：雨桥的栏杆 ================= */
  (function(){
    var x0=2*ZONE_W;
    c.fillStyle='#4a3524'; c.fillRect(x0,GROUND-42,SCENE_W,3);   /* 上扶手 */
    c.fillStyle='#2b1d13'; c.fillRect(x0,GROUND-39,SCENE_W,1);
    c.fillStyle='#4a3524'; c.fillRect(x0,GROUND-24,SCENE_W,2);   /* 下横杆 */
    for(i=0;i<SCENE_W;i+=26){
      c.fillStyle='#3a2418'; c.fillRect(x0+i,GROUND-42,3,42);
      c.fillStyle='#54392a'; c.fillRect(x0+i,GROUND-42,1,42);
    }
    /* 桥头的两盏路灯：桥上唯一的光源，也是画面里最冷的两点 */
    [[2*ZONE_W+36],[2*ZONE_W+SCENE_W-52]].forEach(function(l){
      lamp(l[0],GROUND,66,{sw:13,arm:0,r:26,r2:15,
        col:'#1b2430',col2:'#33455a',pIn:'#6a5f3c',pOut:'#45402c'});
    });
  })();

  /* ================= z3：岸 ================= */
  (function(){
    /* 缆桩：立在楼梯脚下，标记"桥到此为止"。桩子踩在岸面上（SG），
       不再和桥面同高——岸比桥低 24，桩子浮在桥面高度会读成插在半空 */
    var bx=STAIR_B+18;
    /* 缆桩顶上的小灯。它标的是"桥到此为止"，所以光给得很小——
       岸这一侧本来就该是暗的 */
    lamp(bx,SG,30,{sw:11,arm:0,r:17,r2:10,
      col:'#241f2c',col2:'#3a3348',sw2:5,pIn:'#6a5f3c',pOut:'#45402c'});

    /* 栏杆只从缆桩往前一小段就收住。它原来一路铺到水边，等于在海上
       隔了道墙——海要能直接看到，栏杆只标出"人站得住的那条线" */
    var RL=150;
    for(i=0;i<RL;i+=22) c.fillStyle='#2b1d13', c.fillRect(bx+14+i,SG-26,3,26);
    c.fillStyle='#3a2418'; c.fillRect(bx+14,SG-23,RL-6,2);

    /* 长椅：猫最后会在这儿坐下，也是 z3 引线指着的那件道具。离栏杆
       隔了 200 格，不用再为它让豁口，靠明度差和挑出的座面自立 */
    var bx4=SHORE_X+120;
    c.fillStyle='#6b4a2f'; c.fillRect(bx4,SG-28,58,2);
    c.fillStyle='#4a3524'; c.fillRect(bx4,SG-26,58,4);
    c.fillStyle='#3a2418';
    c.fillRect(bx4+4,SG-22,4,6); c.fillRect(bx4+50,SG-22,4,6);
    c.fillStyle='#4a3524';
    c.fillRect(bx4+1,SG-12,4,12); c.fillRect(bx4+53,SG-12,4,12);
    c.fillStyle='#241f2c';
    c.fillRect(bx4+1,SG-4,4,4); c.fillRect(bx4+53,SG-4,4,4);
    c.fillStyle='#6b4a2f'; c.fillRect(bx4-3,SG-18,64,2);
    c.fillStyle='#4a3524'; c.fillRect(bx4-3,SG-16,64,2);
    c.fillStyle='#241f2c'; c.fillRect(bx4+1,SG-14,56,1);

    /* 钓鱼台：从滩尾伸进海里的一块木台，四根柱子撑在水里，台头挂一盏灯，
       旁边一支斜插的鱼竿。海面因此有了近景层次，不然空一大片蓝。
       台面起点放在 WATER_X-20：猫停在 WATER_X-26，正好站在台的左沿，
       台身整个露在猫右边，不会被主角挡掉 */
    var px0=WATER_X-20, pw=104, pd=SG-9;
    c.fillStyle='#122b44'; c.fillRect(px0+10,pd+2,pw-20,15);   /* 水里的暗影 */
    for(i=0;i<4;i++){
      var pp=px0+10+Math.round(i*(pw-26)/3);
      c.fillStyle='#2b1d13'; c.fillRect(pp,pd+2,4,16);
      c.fillStyle='#4a3524'; c.fillRect(pp,pd+2,1,16);
    }
    c.fillStyle='#4a3524'; c.fillRect(px0,pd,pw,3);
    c.fillStyle='#6b4a2f'; c.fillRect(px0,pd,pw,1);
    c.fillStyle='#2e2a20';
    for(i=6;i<pw-4;i+=11) c.fillRect(px0+i,pd+1,1,2);
    c.fillStyle='#241f2c'; c.fillRect(px0,pd+3,pw,1);
    /* 台头的灯：立在台面上。它的光池落在台下的水里，所以外圈用水色、
       内圈给暖色——台灯在水里的反光是暖的，水本身是冷的，
       两层颜色分开才读得出"光落在水面上"而不是"水里有一块蓝斑" */
    lamp(px0+pw-20,pd,16,{sw:9,arm:0,r:15,r2:9,sw2:4,
      col:'#1b2430',col2:'#33455a',pIn:'#6a5f3c',pOut:'#2c4a68'});
    /* 鱼竿斜插在台面上，线垂进水里 */
    c.fillStyle='#2b1d13';
    c.fillRect(px0+30,pd-14,1,14); c.fillRect(px0+31,pd-12,1,12); c.fillRect(px0+33,pd-10,1,10);
    c.fillStyle='#8a8f99'; c.fillRect(px0+34,pd-8,1,13);

    /* 水边探进水里的石头 */
    for(i=0;i<5;i++){
      var px3=WATER_X-16+i*11;
      c.fillStyle='#3a3f47';
      c.fillRect(px3,SG-2-Math.floor(rnd()*5),9,5+Math.floor(rnd()*3));
      c.fillStyle='#565c66'; c.fillRect(px3,SG-2-Math.floor(rnd()*5),9,1);
    }
    /* 远处海面上的一点渔火 */
    c.fillStyle=PAL.O; c.fillRect(WATER_X+150,SG+10,2,2);
    c.fillStyle='#ffd98a'; c.fillRect(WATER_X+150,SG+10,1,1);
  })();

  /* ==========================================================
     前景层（1.25x）：从猫面前掠过的深色剪影
     ========================================================== */
  c=fore.c;
  /* PG 是这一件前景道具脚下那条地面的高度。岸比桥低 24，z3 的前景要跟着
     落到 SG，否则整排剪影会浮在岸上方 24 格的半空里 */
  var PG=GROUND;
  /* 只剩路灯。之前这里有三种：路灯柱、弧形灌木、桥墩、栏杆，全是纯黑剪影。
     灌木那三团弧线改过一次还是被否——问题不在形状，在这层语言本身：1.25x 的
     前景是"从镜头边擦过去的暗部"，用来给画面压出前后层次。一旦这一层开始
     放灌木和栏杆，它就读成一排挡在猫前面的黑三角：轮廓全是尖的、颜色全是
     近黑、每一件的高度都卡在猫的胸口到头顶之间，观众第一眼看到的是遮挡，
     不是深度。所以这一层只保留一种东西——灯。
     灯之所以能留，是因为它自带光：亮芯 + 十字光晕 + 地面光池。剪影的柱身
     仍然是暗的，但灯罩那一小块是画面上最亮的东西，于是它读成"光从前景
     掠过去"，而不是"黑东西挡在前面"。间距同时从 74 放宽到 126。 */
  function prop(x){
    var GY=PG;
    /* 柱：向左伸出一段悬臂，灯罩挂在悬臂末端。这是前景里少数几个
       认得出"是灯"的轮廓线索——只画一根竖线加一个方块，缩小以后
       和路牌、木桩分不开 */
    c.fillStyle='#0b0a12'; c.fillRect(x+8,GY-46,5,46);
    c.fillStyle='#1f1c2e'; c.fillRect(x+8,GY-46,1,46);   /* 柱左缘受月光 */
    c.fillStyle='#0b0a12'; c.fillRect(x-6,GY-48,15,3);  /* 悬臂 */
    c.fillStyle='#1f1c2e'; c.fillRect(x-6,GY-48,15,1);
    c.fillStyle='#0b0a12'; c.fillRect(x+4,GY-52,11,5);  /* 灯罩 */
    c.fillStyle='#07060c'; c.fillRect(x+4,GY-47,11,1);
    /* 灯芯：整层唯一的亮色 */
    c.fillStyle=PAL.O;    c.fillRect(x+6,GY-50,7,3);
    c.fillStyle='#ffe9b0'; c.fillRect(x+7,GY-50,5,1);
    /* 不画光柱。原来在灯罩正下方吊一条 20 格长的淡黄竖条，实测在
       1.25x 视差下它比灯罩还宽、垂到地面，读成"一根黄柱子"而不是光。
       这一层是剪影层，本来就只该负责压暗和给灯一个位置；光交给主层 */
    /* 地面上一个小光池：灯"落"在哪儿，地面就得亮哪儿 */
    for(var g2=0;g2<7;g2++){
      var gw=Math.round(11*Math.sqrt(1-(g2/6)*(g2/6)));
      c.fillStyle=g2<3?'#3a3524':'#2a281c';
      c.fillRect(x+9-gw,GY-3+g2,gw*2+1,1);
    }
    c.fillStyle='#0b0a12'; c.fillRect(x+6,GY-4,9,4);     /* 柱脚 */
    c.fillStyle='#151322'; c.fillRect(x+6,GY-4,9,1);
  }
  /* 前景灯不再平铺。原来是每区 10 盏、间距 126 一路排到底——等距本身就是
     问题：等距的东西读出来是图案，不是街道，一眼看到的是"一堵黑柱墙"。
     改成按世界坐标手排，每一盏落在"这里真的该有一根灯"的位置上：
     家门口一棵、街上三棵（这一段最密，是住着人的街）、桥上两棵、
     台阶顶一棵、岸上一棵。间距在 210..450 之间不均变，每区起点也不同。
     岸那一段只留一根——开阔的岸边本来就不该排灯。 */
  var FORE_LAMPS=[
      525,  988,            /* 家门口 · 街口          间距 463 */
     1400, 1725, 2288,      /* 街上三棵              间距 325 / 563 */
     2725, 3063, 3325,      /* 桥上两棵 + 台阶顶一棵  间距 338 / 262 */
     3850                    /* 岸上最后一棵          前面留了 525 的空档 */
  ];
  for(i=0;i<FORE_LAMPS.length;i++){
    var fx=FORE_LAMPS[i];
    /* 前景道具脚下那条地面的高度。1.25 是视差，除回去才是世界坐标。
       用 groundAt 而不是按区硬判：T3 那一段台阶横跨在 GROUND 和 SG
       之间，只按区取高度的话，台阶顶那盏会浮在岸上方 24 格的半空 */
    PG = groundAt(Math.round(fx/1.25));
    prop(fx);
  }

  return {skys:skys, far:far.cv, main:main.cv, fore:fore.cv,
          farW:FAR_W, foreW:FORE_W, shoreX:SHORE_X, waterX:WATER_X};
}


/* ============================================================
   视图：相机 + 猫
   ============================================================ */
var view={cv:null,ctx:null,S:1,camX:0,viewW:480,viewH:260,world:null,vw:0,vh:0,groundY:0,destY:0};
/* idle: 距离上一次人工输入过了几秒；patrol: 巡逻的临时目标；
   pause: 走到巡逻点后停一停的时间；asleep: 盘起来睡了 */
var cat={x:200, dir:1, moving:false, target:null, hop:0, ph:0, blinkAt:2, blinkUntil:-1,
         idle:0, patrol:null, pause:0, asleep:false, nap:0, napLim:9, pauseLim:2.4};
var CAT_SX=190;          /* 猫在屏幕上的固定位置（世界单位） */
var dust=[];
/* 闪电：只落在桥上。t 是下次触发倒计时，flash 是当前亮度 */
var light={t:5,flash:0,x:0,seed:1};
/* 海里那条小鱼。dir 是当前朝向（1 向右），t 是到下次跃出水面的秒数，
   j 是跃起进度 0..1（0=在水里，1=刚入水），jz 是它那条抛物线的参数。
   这些都在 frame() 里逐帧积分，所以主层是烘焙死的也不影响它动 */
var fish={x:(FISH_X0+FISH_X1)/2, dir:-1, t:2.5, next:5, j:0, wet:0};
function layout(){
  var vw=window.innerWidth, vh=window.innerHeight;
  /* 横向缩放和纵向解耦：地平线钉在视口 72% 高度，
     天空和地面的不足部分用纯色补齐，否则窄屏会被拉到看不清全貌 */
  var S=Math.max(1, Math.min(vh/205, vw/330));
  /* S 必须吸附到整数，否则整幅画就不是像素画了：精灵按 mul=2 绘制，
     非整数 S 会让每个源像素落到 8.7 个设备像素上，位图被重采样出
     逐格的半透明接缝——实测一块纯橘色毛发上有 301 种颜色。
     取整后不足的部分由上下纯色补齐（下面两行 fillRect 已经在做这件事） */
  S=Math.max(1, Math.floor(S));
  view.S=S; view.vw=vw; view.vh=vh;
  view.viewW=vw/S;
  /* NARROW 阈值必须和 CSS 里的 @media (max-width:860px) 对齐：
     不一致的话 700-860px 的平板会走桌面定位分支，但 CSS 已把面板变成
     width:auto，于是 offsetWidth 取到整宽、x 被钳到猫身上，面板压住主角 */
  view.groundY=Math.round(vh*(vw<=860?0.42:0.80));
  /* destY 是"世界单位"下的绘制偏移：世界内部 y=GROUND 要落在屏幕 groundY，
     即 (destY+GROUND)*S = groundY，所以要除以 S，不能用 GROUND*S */
  view.destY=view.groundY/S-GROUND;
  view.cv.width=vw; view.cv.height=vh;
  view.cv.style.width=vw+'px'; view.cv.style.height=vh+'px';
  /* 猫锁在屏幕左侧，给右边的面板让位。
     必须吸附到 1/S 的整数倍：精灵在 mul=2 下每个源像素占 8 个设备像素，
     一旦落点是小数设备像素，最近邻绘制会让每一道块边界都产生 1px 部分
     覆盖的混合缝——实测额头一行是 "K x7 | 混合色 x1 | O x7 | 混合色 x1"，
     整只猫因此蒙上一层等距的淡色网格 */
  CAT_SX=Math.round(Math.min(view.viewW*0.26, 200)*S)/S;
  updateScrollHints();
}

function zoneOf(x){ return Math.max(0,Math.min(NZ-1,Math.floor(x/ZONE_W))); }

/* 落地扬尘：像素小点向上飘散后消失。x 是相对猫的偏移，不是世界坐标；
   dir 让尘土朝"身后"飞——往左跑就往右扬 */
function puff(y,dir){
  var d=dir||1, p=[];
  for(var i=0;i<5;i++) p.push({x:d*-i*2.2, y:y, vx:d*(-0.9-i*0.25), life:0.4+i*0.05});
  dust.push({p:p,age:0});
}

/* 减少动效：必须尊重。这是一整幅会自动横移的世界，持续弹跳 + 相机滞后
   正是最容易引发前庭不适的那类动效，所以偏好里声明了就要在 JS 里真的生效
   —— 只关 CSS transition 是不够的，画布上的运动完全不受它影响 */
var RM=window.matchMedia?matchMedia('(prefers-reduced-motion: reduce)'):{matches:false};

/* 帧率无关：原来所有速度都写死 0.016（假定 60fps），在 120/144Hz 屏上
   猫会快一倍、相机也快一倍。改用真实时间差并夹住，切回标签页时
   不会因为攒了一长串 dt 而瞬移。 */
var lastT=0;

function frame(now){
  var c=view.ctx, S=view.S;
  if(!lastT) lastT=now;
  var dt=(now-lastT)/1000; lastT=now;
  if(!(dt>0)) dt=0.016;
  if(dt>0.05) dt=0.05;
  /* --- 输入 --- */
  var run=false, userActed=false;
  if(cat.target!==null){
    var d=cat.target-cat.x;
    if(Math.abs(d)<3){ cat.target=null; }
    else { cat.x += (d>0?1:-1)*Math.min(Math.abs(d), 340*dt); cat.dir = d<0?-1:1; run=true; }
  }
  if(keys.left && cat.target===null){ cat.x-=105*dt; cat.dir=-1; run=true; userActed=true; }
  if(keys.right&& cat.target===null){ cat.x+=105*dt; cat.dir=1;  run=true; userActed=true; }
  if(drag!==null){ var ddx=drag-cat.x; if(Math.abs(ddx)>2){ cat.x+=ddx*0.25; cat.dir=ddx<0?-1:1; run=true; userActed=true; } }

  /* --- 猫的三态 ------------------------------------------------------
     run    人工选定了位置，跑过去（340/s）
     patrol 没人操作时，在【整条路】上随机找个地方走走停停（40/s）
     nap     停太久就地打个盹，7~12 秒后自己醒，继续走
     ----------------------------------------------------------------
     原来这一段有两处让人看着像"卡住了"：
     1 巡逻目标是 lo..hi，也就是当前区里 `ZONE_W+70 .. ZONE_W+SCENE_W-70`
       那一小段。猫永远在自家门口转悠，画面上看它就没去过别处。
     2 `cat.idle>=16` 之后 asleep=true，而【没有任何一条路径会把它叫醒】——
       除了人工输入。所以"坐下"是不可逆的，那不叫巡逻，那叫停了。
     现在目标是相对当前位置的随机距离（240..1100 格），可能往左也可能往右，
     跨区是常事；打盹有 nap 计时，到点自己起身。 */
  if(userActed || cat.target!==null){ cat.idle=0; cat.pause=0; cat.nap=0; cat.asleep=false; }
  else cat.idle+=dt;

  if(cat.target===null){
    /* 走得到的尽头：水边留 40 格，所以猫永远不会站在水面上 */
    var hiRoad=Math.max(60,(view.world?view.world.waterX-40:WORLD_W-60));
    if(cat.asleep){
      cat.nap+=dt;
      /* 打完盹自己起身，接着走。阈值在这帧定一次，不要每帧重抽——
         每帧重抽的话 pause 到了 3.0 而这一帧抽到 1.6 就提前醒了 */
      if(cat.nap>cat.napLim){ cat.asleep=false; cat.nap=0; cat.idle=0.2; }
    } else if(cat.idle>2.2){
      if(cat.patrol===null){
        /* 距离 300..1500 格。原来的 240..1100 试过：一轮最多走 1100 格、
           40 格/秒，也就是 27 秒——但模拟里 150 秒只跑到 x=1647，
           桥和岸根本没被走到过。1500 的上限让它够得着水边 */
        var span=300+Math.random()*1200;
        var tgt=Math.max(46,Math.min(hiRoad, cat.x+(Math.random()<0.5?-1:1)*span));
        /* 到了尽头就往回走。夹一次边界之后目标和脚下只差两三格，
           于是"走"这一段被跳过、立刻进 SIT、再立刻换点——模拟里读成
           SIT 9.0s / idle 9.0s / SIT 9.0s 连续三次，猫在原地抽搐 */
        if(Math.abs(tgt-cat.x)<40){
          tgt=Math.max(46,Math.min(hiRoad, cat.x-(tgt-cat.x)));
        }
        cat.patrol=tgt;
        cat.pause=0;
        cat.pauseLim=1.4+Math.random()*3.2;
      } else {
        var pd=cat.patrol-cat.x;
        if(Math.abs(pd)<4){
          cat.x+=pd;
          cat.pause+=dt;
          if(cat.pause>cat.pauseLim){
            cat.patrol=null; cat.pause=0;
            /* 一直没人管：停够了就地打个盹，不再挑新点。判据挂在
               "刚停完"这一刻，而不是某一帧的 cat.patrol===null——
               那个判据在换点的瞬间也成立，会让猫走着走着就坐下。
               阈值 34 是模拟出来的：idle 每轮（走+停）涨 20~30 秒，
               用 9 的话每轮停完都睡，NAP 占掉 31% 的时间，页面读起来
               是"睡着的猫偶尔走两步"；34 让它连着走三四趟才歇一次 */
            if(cat.idle>34){
              cat.asleep=true; cat.nap=0; cat.napLim=7+Math.random()*5;
            }
          }
        } else {
          cat.x+=(pd>0?1:-1)*Math.min(Math.abs(pd),40*dt);
          cat.dir=pd<0?-1:1;
          run=true;
        }
      }
    }
  } else cat.asleep=false;

  if(cat.x<30) cat.x=30;
  /* 岸的尽头就是水：猫走到水边就停下，这也是整条巡逻路线的收尾 */
  var waterEdge=view.world?view.world.waterX-26:WORLD_W-30;
  if(cat.x>waterEdge){ cat.x=waterEdge; cat.patrol=null; }
  cat.moving=run;
  if(cat.asleep) cat.moving=false;

  /* --- 相机跟随 --- */
  var want=cat.x-CAT_SX;
  var maxCam=Math.max(0, WORLD_W-view.viewW);
  var goal=Math.max(0,Math.min(maxCam,want));
  /* 每帧 0.14 的缓动，换算成与帧率无关的等效插值系数 */
  view.camX += (goal-view.camX)*(1-Math.pow(1-0.14, dt*60));
  /* 减少动效：相机不追赶。缓动滞后意味着输入已经结束了画面还在继续漂，
     这段"余漂"比移动本身更容易触发前庭反应，所以这里直接吸附 */
  if(RM.matches) view.camX=goal;
  if(view.camX<0) view.camX=0;
  if(view.camX>maxCam) view.camX=maxCam;

  /* --- 绘制世界：天空 + 三层视差 + 天气 --- */
  c.setTransform(1,0,0,1,0,0);
  c.fillStyle=SKY_TOP; c.fillRect(0,0,view.vw,view.vh);
  c.fillStyle=GND_BOT;  c.fillRect(0,view.groundY,view.vw,view.vh-view.groundY);
  c.imageSmoothingEnabled=false;
  c.setTransform(S,0,0,S,0,0);
  var W=view.world, DY=view.destY;

  /* 天空：按猫所在的区域选图，接近边界时交叉淡入下一张。
     天空只做 0.06x 的极慢漂移——它比区域间距（640）小两个数量级，
     真按视差铺开的话各区天空和地面根本对不上 */
  var zf=Math.max(0,Math.min(NZ-1,cat.x/ZONE_W));
  var zA=Math.floor(zf), zB=Math.min(NZ-1,zA+1), zt=zf-zA;
  var skyBlend=(zB!==zA && zt>0.76) ? (zt-0.76)/0.24 : 0;
  var so=view.camX*0.06, s1=((so%SKY_W)+SKY_W)%SKY_W;
  function skyRow(img,alpha){
    if(alpha<1) c.globalAlpha=alpha;
    for(var x=-s1;x<view.viewW;x+=SKY_W) c.drawImage(img,Math.round(x),DY);
    if(alpha<1) c.globalAlpha=1;
  }
  skyRow(W.skys[zA].cv,1);
  if(skyBlend>0) skyRow(W.skys[zB].cv,skyBlend);

  /* --- 闪的星 + 飘的云 ------------------------------------------------
     天空是烘焙好的静态图，星星本来是一动不动的一层白点。现在每帧再画
     一层亮星和几朵云，位置一律由下标哈希决定——用 Math.random 的话
     每帧位置都在变，读起来是噪点不是星空。
     位置跟着天空的 0.06x 漂移，所以它们像是挂在天上的，不是贴在屏幕上的。
     减少动效下两者都还画，只是速度和呼吸都归零：全删掉会读成"没做完"，
     停下来才是"安静" */
  (function(){
    var tStars=RM.matches?0:1, tCloud=RM.matches?0:1;
    /* 逐帧的星改在【设备像素空间】画。S 是小数（窄屏 1.18），在缩放变换里
       fillRect 会把落在分数设备像素上的边缘混合掉——像素画的硬边就没了，
       星星也混成灰绿色、既不好看也数不出来。imageSmoothingEnabled 只管
       drawImage，管不了 fillRect。换成整数设备坐标后边缘才是硬的。
       同一原因，云也一起搬进来 */
    c.save();
    c.setTransform(1,0,0,1,0,0);
    for(var ts=0;ts<34;ts++){
      var h1=(ts*2654435761)>>>0;
      var tgx=(h1>>>4)%SKY_W, tgy=16+((h1>>>13)%150);
      var br=2;
      if(tStars){
        var ph=((now*0.00085+((h1>>>9)%100)/100)%1);
        br=ph<0.30?2:(ph<0.58?1:0);
      }
      if(br===0) continue;
      /* 每一颗画出来的星都必须大于一个世界单位。原来三层都只画 1x1：
         窄屏下一颗星不到一个设备像素，落在密点天空里既看不见也数不出来
         ——闪烁等于没做，"美观"也就没兑现。最亮档 2x2，中档 2x1 */
      var sw=2, sh=br===2?2:1;
      for(var tk=-s1;tk<view.viewW;tk+=SKY_W){
        var dx0=Math.round((tk+tgx)*S), dy0=Math.round(tgy*S);
        var dw=Math.max(1,Math.round(sw*S)), dh=Math.max(1,Math.round(sh*S));
        /* 十字光芒先画、再压实心核心。反过来画的话横臂盖掉核心底行、
           竖臂盖掉右列，一颗 2x2 的亮星实际只剩左上角 1 个像素 */
        if(br===2){
          c.fillStyle='#6b6288';
          c.fillRect(dx0-1, dy0+(dh>>1), dw+2, 1);
          c.fillRect(dx0+(dw>>1), dy0-1, 1, dh+2);
        }
        c.fillStyle = br===2 ? '#fffaf0' : '#8a8f99';
        c.fillRect(dx0, dy0, dw, dh);
      }
    }
    /* 云：只两档硬边色叠出台阶形的边。像素里的云是一叠小方块，
       画成柔和的椭圆就破了整站的硬边语言 */
    for(var ci=0;ci<5;ci++){
      var hc=(ci*40503)>>>0;
      var cyy=26+(hc>>>5)%118, cww=52+(hc>>>11)%52;
      var spd=tCloud ? 0.0035+((hc>>>3)%7)*0.0012 : 0;
      var span=view.viewW+cww+120;
      var cxx=(((hc>>>17)%span)+now*spd)%span-cww-60;
      var base=ci%2 ? '#282239' : '#211c30';
      c.fillStyle=base;
      c.fillRect(Math.round(cxx*S)+Math.round(cww*0.28*S), Math.round(cyy*S), Math.max(1,Math.round(cww*0.44*S)), Math.max(1,Math.round(3*S)));
      c.fillRect(Math.round(cxx*S)+Math.round(cww*0.14*S), Math.round(cyy*S)+Math.round(2*S), Math.max(1,Math.round(cww*0.72*S)), Math.max(1,Math.round(3*S)));
      c.fillRect(Math.round(cxx*S), Math.round(cyy*S)+Math.round(4*S), Math.max(1,Math.round(cww*S)), Math.max(1,Math.round(2*S)));
      /* 顶上压一道月光边：云的形状全靠这条边读出来，光靠一整块暗色
         在夜空上只会读成一道污痕 */
      c.fillStyle=ci%2 ? '#3b3457' : '#332d4b';
      c.fillRect(Math.round(cxx*S)+Math.round(cww*0.34*S), Math.round(cyy*S)-Math.max(1,Math.round(2*S)), Math.max(1,Math.round(cww*0.3*S)), 1);
      c.fillRect(Math.round(cxx*S)+Math.round(cww*0.16*S), Math.round(cyy*S)+Math.round(1*S), Math.max(1,Math.round(cww*0.68*S)), 1);
      c.fillStyle=ci%2 ? '#2b2540' : '#231e33';
      c.fillRect(Math.round(cxx*S)+Math.round(cww*0.46*S), Math.round(cyy*S)-Math.max(1,Math.round(3*S)), Math.max(1,Math.round(cww*0.14*S)), 1);
    }
    c.restore();
  })();
  /* 远景 0.45x：各区内容摆在 farX(z)，所以第 z 区的远景就贴在第 z 区旁边 */
  c.drawImage(W.far, -view.camX*0.45, DY);
  /* 主层 1.00x：地面、小屋、公告栏、桥、岸、猫都在这层 */
  c.drawImage(W.main, -view.camX, DY);

  /* --- 海里的小鱼 -----------------------------------------------------
     海是烘焙好的一整片蓝，画得再细它也不动。而海面恰恰是这幅画里最该
     有动静的一块：它最平、最亮、最该反光。摊着不动比没有海更假。
     所以这一片必须有一个活着的东西——一条来回游的鱼。
     它比星空更该做：星空本来就在闪（那是它的常态），云本来就该飘，
     海面却什么都不做。所以这里是唯一一处"给一个静止的地方加生命"。
     画在【设备像素空间】：世界坐标乘上 S 之后经常落在分数设备像素上，
     fillRect 会被抗锯齿，鱼身会糊出一圈灰边——和星与云踩过的同一个坑。
     形状按 S 放大，但每个矩形都取整到设备像素，所以放大后仍然是硬边。 */
  (function(){
    var q0=Math.floor(view.camX)-48, q1=Math.ceil(view.camX+view.viewW)+48;
    if(FISH_X1<q0 || FISH_X0>q1) return;              /* 不在视口里，整段跳过 */
    if(!RM.matches){
      if(fish.wet>0) fish.wet=Math.max(0, fish.wet-dt);
      fish.t+=dt;
      if(fish.t>fish.next && fish.j<=0){ fish.t=0; fish.next=4.5+Math.random()*5; fish.j=1; }
      if(fish.j>0 && fish.j-dt/0.95<=0) fish.wet=0.75; /* 刚好落水 */
      fish.x += fish.dir*(fish.j>0?78:24)*dt;
      if(fish.x>FISH_X1){ fish.x=FISH_X1; fish.dir=-1; }
      if(fish.x<FISH_X0){ fish.x=FISH_X0; fish.dir=1; }
      if(fish.j>0) fish.j=Math.max(0, fish.j-dt/0.95);
    }
    /* 跃起的抛物线：j 从 1 回到 0，jz 是它上面的参数。最高点在水面之上
       17 格——鱼要能真的整个身体离开水面，光靠平移是跃不起来的 */
    var jz = fish.j>0 ? (1-fish.j) : 0;
    var hop = Math.round(68*jz*(1-jz));
    var sway = RM.matches ? 0 : Math.round(Math.sin(now*0.0032)*1.3);
    var wy   = FISH_Y + sway - hop;
    /* 尾巴两帧：游动时 5.5Hz 摆一次，跃起时快一倍 */
    var tail = RM.matches ? 0 : (Math.floor(now*(fish.j>0?0.023:0.011))%2);

    c.save();
    c.setTransform(1,0,0,1,0,0);
    var U=Math.max(1,Math.round(S));
    var ox=Math.round((fish.x-view.camX)*S), oy=Math.round((wy+view.destY)*S);
    if(ox>-26*U && ox<view.vw+26*U){
      /* px 用世界格做坐标，朝左游时整条镜像到 ox 左边 */
      function px(fx2,fy2,fw,fh){
        var wpx=Math.round(fw*U), hpx=Math.round(fh*U);
        var bx2=(fish.dir<0)?ox-Math.round(fx2*U)-wpx:ox+Math.round(fx2*U);
        c.fillRect(bx2, oy+Math.round(fy2*U), wpx, Math.max(1,hpx));
      }
      /* 鱼在深蓝里必须比水亮一档才看得见，但也不能亮到发光。先压一层
         更暗的鱼影让身体从水色里浮出来，再往上盖背光面。
         轮廓是纺锤，不是方块：尾柄只有 2 格高、身体 4 格、头 5 格，
         背线从尾往头一级级升上去。前一版是一条 6x4 的直筒加一个 3x5
         的方脑袋，整条鱼读成一个横着的矩形；11x5 这个尺度画不出曲线，
         唯一的办法就是让背线和腹线【不等长】——头的背高出一格，尾柄
         的上下往中间收，才看得出哪头是头。 */
      c.fillStyle='#132740'; px(-1,1,13,5);
      /* 尾柄：全鱼最细的地方，和尾鳍连着 */
      c.fillStyle='#2a5170'; px(0,2,2,2);
      /* 尾鳍两帧：一帧平分，一帧下摆。摆尾是"活着"和"被贴上去"的分界，
         所以尾鳍比身子暗一档但要够大，小了就只剩一个缺口 */
      if(tail===0){ px(-3,0,3,2); px(-3,4,3,2); }
      else         { px(-3,1,3,4); px(-2,0,2,2); px(-2,4,2,2); }
      c.fillStyle='#2b5470'; px(2,1,6,3);      /* 背：最暗的一面 */
      c.fillStyle='#4a7691'; px(2,3,6,2);      /* 腹：受光的一面 */
      c.fillStyle='#31607e'; px(8,0,3,5);      /* 头：背比身体高出一格 */
      c.fillStyle='#4a7691'; px(8,3,3,2);
      c.fillStyle='#27506b'; px(5,-1,2,2);     /* 背鳍 */
      c.fillStyle='#6f9ab5'; px(3,2,5,1);      /* 侧线：夜里靠它读出"这是一条鱼" */
      c.fillStyle='#080d14'; px(9,1,1,2);      /* 眼 */
      c.fillStyle='#ffe9b0'; px(9,1,1,1);
      /* 跃到最高点前后：头顶甩出几颗水珠 */
      if(fish.j>0 && jz>0.2 && jz<0.8){
        c.fillStyle='#9fc2d8'; px(4,-2,1,1); px(7,-3,1,1); px(8,-1,1,1);
        c.fillStyle='#c9dcea'; px(5,-4,1,1); px(7,-5,1,1);
      }
      /* 落水的涟漪：水面上一圈往外推的硬边环。跃起和落水都被看见，
         "游来游去"才读得出是一条活鱼在来回，不是一个贴图在平移 */
      if(fish.wet>0){
        var wr=fish.wet*52;
        var sy3=Math.round((SHORE_Y+view.destY)*S);
        c.fillStyle='#2a4d6b';
        for(var k2=-4;k2<=4;k2++){
          var half=Math.round(Math.sqrt(1-(k2*k2)/25)*wr);
          c.fillRect(ox-half, sy3+k2*U, 2*U, U);
        }
        if(wr<20){
          c.fillStyle='#7ba6c2';
          for(var k3=-1;k3<=1;k3++){
            var half2=Math.round(Math.sqrt(1-(k3*k3)/4)*wr);
            c.fillRect(ox-half2, sy3+k3*U, 2*U, U);
          }
        }
      }
    }
    c.restore();
  })();

  /* --- 雨：只在桥上（z2）下，边界附近淡入淡出。
     强度按"离区域边缘多远"算，不是按区域内位置线性缩放——
     之前写成 1-zt，结果在桥的正中间强度只有 0.5，等于雨桥几乎不下雨。
     雨不受 reduced-motion 限制：它是小范围粒子，关掉场景就读成"没做完"。
     真正要避开的留给下面的闪电——整屏闪白对光敏用户风险最大 --- */
  var p2=(cat.x-2*ZONE_W)/SCENE_W;          /* 在 z2 区间里的相对位置 */
  var rainAmt=0;
  if(p2>-0.18 && p2<1.18){
    rainAmt=Math.min(1,(p2+0.18)/0.30);    /* 进场 0.30 段淡入 */
    rainAmt=Math.min(rainAmt,(1.18-p2)/0.30); /* 出场 0.30 段淡出 */
    rainAmt=Math.max(0,Math.min(1,rainAmt));
  }
  if(rainAmt>0){
    /* 关键：主上下文只有 setTransform(S,0,0,S,0,0)，相机偏移是每个 drawImage
       自己带的（-camX 和 DY）。所以凡是直接 fillRect 画的东西，都必须自己
       补上这两个平移，否则坐标是世界坐标，会被整体甩到屏幕右侧几千像素外。
       雨、桥面溅点、闪电折线三段都栽过这一下：雨桥一直"不下雨"。 */
    c.save();
    c.translate(-view.camX, DY);
    var rx0=Math.floor(view.camX)-20, rw=Math.ceil(view.viewW)+40;
    /* 雨落在桥面上就停。原来 span 给到 GROUND+40，雨会一直掉到桥下的空洞里，
       而那块根本没有"雨该落在哪儿"这个概念 */
    var span=GROUND-2;
    var rn=Math.round((RM.matches?300:560)*rainAmt)+24;
    /* 一层很淡的雨幕：光靠稀疏雨滴读不出"在下雨"，得有个底。
       现在已经在世界坐标系里，y 从 0 起算，不需要再加 DY */
    c.fillStyle='rgba(120,150,182,'+(0.05*rainAmt).toFixed(3)+')';
    c.fillRect(rx0,0,rw,GROUND);
    for(var ri=0;ri<rn;ri++){
      var sd=(ri*2654435761)>>>0;
      var dx=rx0+((sd>>>7)%rw);
      var sp=96+((sd>>>3)%9)*12;                 /* 每秒下落的格数 */
      var ph=((sd>>>11)+now*0.001*sp)%span;
      var dy=Math.round(ph);
      var len=4+((sd>>>17)%4);                   /* 长短不齐，否则是一排刻度线 */
      /* 单条压低透明度、靠条数堆密度：0.62 配稀疏间距时每条都太抢眼 */
      c.fillStyle='rgba(198,222,246,'+(0.34*rainAmt).toFixed(2)+')';
      c.fillRect(dx,dy,1,len);
      c.fillStyle='rgba(132,166,202,'+(0.22*rainAmt).toFixed(2)+')';
      c.fillRect(dx+1,dy+len-1,1,2);             /* 斜一格，读起来才有风向 */
    }
    /* 雨打在桥面上的溅点：让雨和桥在同一个空间里 */
    if(rainAmt>0.4){
      var sx3=Math.floor(view.camX);
      c.fillStyle='rgba(214,236,255,'+(0.46*rainAmt).toFixed(2)+')';
      for(var sj=0;sj<40;sj++){
        var ss2=(sj*40503)>>>0;
        var sxp=sx3+((ss2>>>5)%rw);
        var syt=GROUND-1;                        /* 桥板上表面，不是桥下的空洞 */
        var ph2=((now*0.003+(ss2>>>9)%97/97)%1);
        c.fillRect(sxp,Math.round(syt-ph2*3),1,1);
        c.fillRect(sxp-1,Math.round(syt-ph2*3),1,1);
        c.fillRect(sxp+1,Math.round(syt-ph2*3),1,1);
      }
    }
    c.restore();
  }

  /* --- 猫：注意要加上世界条带的 destY 偏移，否则会浮空 --- */
  /* 走和跑仍是两种手感，靠速度、弹跳高度、扬尘和前倾区分，不靠换精灵。
     曾经给两者各画了四帧带腿的精灵，用户看过说还是原来这个好，已经撤回：
     8 帧 28 行高之后猫在 1.25x 前景前显得又宽又散，腿只有 5 行、放大后
     像贴纸；现在共用一张 24 行精灵，靠前倾 + 上下弹 + 扬尘表达移动。 */
  var running = cat.target!==null || keys.left || keys.right || drag!==null;
  var anim = cat.moving && !RM.matches;
  var hopN = anim ? Math.max(0,Math.sin(now*(running?0.013:0.009)+cat.ph)) : 0;
  var hop = hopN*(running?4.2:1.6)*Math.PI;
  var catG = groundAt(cat.x);                  /* 岸边比桥低，猫得跟着地面走 */
  if(anim && Math.random()<(running?0.20:0.05)) puff(catG,cat.dir);
  pixelShadow(c, CAT_SX, DY+catG+1, 9-hop*0.5);
  /* 停和睡共用那张盘起来的精灵，靠时长区分：歇 1.4~4.6 秒，盹 7~12 秒。
     站着纹丝不动读成"卡住了"，盘起来读成"它在那儿歇一会儿"——然后它会
     站起来接着走，这正是要的"走走停停"。坐着的时候不跟朝向翻转，
     理由和睡着一样：盘起来的身体没有明确的左右 */
  var sitting = cat.asleep || (!cat.moving && cat.pause>0.7);
  var nm;
  if(sitting){
    nm='cat24_sleep';
  } else {
    var blink = !RM.matches && now<cat.blinkUntil;
    nm = blink ? 'cat24_blink' : 'cat24';
  }
  /* 坐/走/跑/睡共用同一张 24 行精灵：移动靠前倾 + 上下弹 + 扬尘表达。
     曾经试过给走和跑各画一套四帧带腿的精灵（cat24_walk0-3 / cat24_run0-3），
     用户看过之后说还是原来这个好——像素体量小、身形不散，而且腿只有
     5 行、放大后反而像贴纸。生成器已删，这里不要再引用那些帧名。 */
  var footOff = 44;
  /* 跑起来时前倾 + 空中横向拉长/落地压扁——横版里没有这个就不像在跑。
     减少动效下全部归零：猫仍然会走到你指定的位置（那是功能），
     但不再上下弹跳、倾斜、形变 */
  var lean = anim ? (running?0.14:0.06)*cat.dir : 0;
  var air = 1-hopN, sq = air*air*air;
  var sxK = anim ? 1 + 0.10*hopN - 0.10*sq : 1;
  var syK = anim ? 1 - 0.10*hopN + 0.10*sq : 1;
  var feetX=CAT_SX, feetY=DY+catG-hop;
  c.save();
  c.translate(feetX, feetY);
  c.rotate(lean);
  c.scale(sxK, syK);
  c.translate(-feetX, -feetY);
  if(cat.dir<0 && !sitting){
    c.save();
    c.translate(CAT_SX,0); c.scale(-1,1);
    drawSprite(c,nm,0,feetY-footOff,2); c.restore();
  } else {
    drawSprite(c,nm,CAT_SX,feetY-footOff,2);
  }
  c.restore();

  /* --- 尘土 --- */
  for(var d2=dust.length-1;d2>=0;d2--){
    var o=dust[d2]; o.age+=dt;
    if(o.age>0.55){ dust.splice(d2,1); continue; }
    for(var i3=0;i3<o.p.length;i3++){
      var p=o.p[i3]; p.x+=p.vx*dt*14; p.y-=dt*9;
      var a=1-o.age/0.55;
      c.fillStyle='rgba(210,196,170,'+a.toFixed(2)+')';
      c.fillRect(Math.round(CAT_SX+p.x),Math.round(DY+p.y),1,1);
    }
  }

  /* --- 前景层 1.25x：画在猫之后，才有"从前面掠过"的层次 --- */
  c.drawImage(W.fore, -view.camX*1.25, DY);

  /* --- 闪电：定时触发，先一道分叉的 bolt，再整屏压一层冷光 --- */
  /* --- 闪电：只在桥上触发 ---
     原来只要 !RM.matches 就跑，而 lightning 里的整屏冷光是 fillRect(0,0,vw,vh)，
     和猫在哪没关系——猫在小屋里、街上也照闪一整屏白。
     雨是小范围粒子，删掉只会读成"没做完"，所以雨保留；
     但整屏闪白是这个页面对光敏用户风险最大的一笔，必须和"猫在桥上"绑定。
     rainAmt 正好就是"离桥多近"（上面算好还在作用域里），直接复用。 */
  if(rainAmt>0.02 && !RM.matches){
    if((light.t-=dt)<=0){
      light.t=6+Math.random()*10;
      light.flash=1;
      light.x=2*ZONE_W+60+Math.random()*(SCENE_W-120);
      light.seed=(Math.random()*1e9)|0;
    }
    if(light.flash>0){
      light.flash=Math.max(0,light.flash-dt*3.4);
      var f2=light.flash;
      if(f2>0.45){
        /* 折线：每段横向抖 1-3 格，纯硬边。
           和雨同一个坑：light.x 是世界坐标，必须先进世界坐标系再画 */
        c.save();
        c.translate(-view.camX, DY);
        var lx=light.x, ly=18, step=0, sd=light.seed;
        c.fillStyle='#e8f2ff';
        for(step=0;step<13 && ly<GROUND-40;step++){
          sd=(sd*1103515245+12345)>>>0;
          var dx2=lx+((sd>>>9)%5)-2;
          var len=8+((sd>>>4)%9);
          c.fillRect(Math.round(dx2),Math.round(ly),2,len);
          if(step===4||step===8){
            var bx2=dx2+( ((sd>>>7)%2)? 9:-9 );
            for(var b3=0;b3<3;b3++) c.fillRect(Math.round(bx2+(b3%2?2:-2)),Math.round(ly+b3*7),2,4);
          }
          ly+=len;
        }
        c.restore();
      }
      /* 整屏冷光：屏幕空间，不吃世界缩放。
         alpha 再压一档：白屏哪怕只在桥上出现，峰值也该是"被照了一下"
         而不是"屏幕炸了" */
      c.setTransform(1,0,0,1,0,0);
      c.fillStyle='rgba(198,220,255,'+(0.13*f2*f2).toFixed(3)+')';
      c.fillRect(0,0,view.vw,view.vh);
      c.setTransform(S,0,0,S,0,0);
    }
  } else if(light.flash>0){
    /* 走出桥区就立刻收掉，不能留半亮的画面；同时把倒计时按住，
       免得离开期间 light.t 一直是负数，一上桥就立刻炸一下 */
    light.flash=0;
    if(light.t<2) light.t=2+Math.random()*4;
  }

  /* --- DOM 同步 --- */
  var zi=zoneOf(cat.x);
  if(zi!==curZone){ curZone=zi; syncZone(zi); }
  positionPanels();
  schedule();
}

/* 标签页隐藏时停循环。用代号而不是只置 paused：浏览器对后台标签的 rAF
   是"挂起"而不是"丢弃"，切回来时那个挂起的回调照样会触发；如果这里只是
   paused=false 再 request 一次，就会变成两个循环同时跑、猫速度翻倍。
   每次 schedule() 递增代号，旧回调发现代号过期就自行退出。 */
var rafGen=0, paused=false;
function schedule(){
  var g=++rafGen;
  requestAnimationFrame(function(t){ if(g!==rafGen||paused) return; frame(t); });
}
document.addEventListener('visibilitychange',function(){
  if(document.hidden){ paused=true; }
  else if(paused){ paused=false; lastT=0; schedule(); }
});

var curZone=-1;
function syncZone(i){
  document.getElementById('zoneCn').textContent=ZONES[i].cn;
  document.getElementById('zoneEn').textContent=ZONES[i].en;
  var bs=document.querySelectorAll('#znav button');
  for(var k=0;k<bs.length;k++) bs[k].setAttribute('aria-current', k===i?'true':'false');
  var ps=document.querySelectorAll('.pip');
  for(var k2=0;k2<ps.length;k2++) ps[k2].className='pip'+(k2<=i?' on':'');
  document.getElementById('trackFill').style.width=((i+1)/NZ*100).toFixed(1)+'%';
}
function positionPanels(){
  var S=view.S, vw=view.vw, gy=view.groundY;
  var narrow = vw<=860;
  /* 同时只让一个面板可见。原来每个面板各自按距离淡入淡出，结果在区域
     边界上两个面板都是半透明，正好压在一起——中文正文互相穿透，
     两边都读不了。改成先选最近的区，再由它单独决定淡入淡出 */
  var zNow=0, dBest=1e9;
  for(var k=0;k<NZ;k++){
    var dk=Math.abs(cat.x-(k*ZONE_W+SCENE_W/2));
    if(dk<dBest){ dBest=dk; zNow=k; }
  }
  for(var i=0;i<NZ;i++){
    var el=document.getElementById('p'+i);
    var zc=i*ZONE_W+SCENE_W/2;
    var vis=0;
    if(i===zNow){
      /* 最近区内：中心满不透明，靠近边缘时快速收掉，绝不给下一个区留叠加。
         夹到 0：过渡带正中离本区中心有 480，算式会给出负透明度。CSS 会把
         负值当 0 渲染所以看不出问题，但 style.opacity 写成 -1.813 这种
         脏值，将来谁按它做判断就会踩坑 */
      vis=Math.max(0, 1-Math.max(0,(dBest-SCENE_W*0.30)/(SCENE_W*0.16)));
    }
    el.classList.toggle('on', vis>0.02);
    el.style.opacity=vis.toFixed(3);
    el.style.pointerEvents = vis>0.5 ? 'auto' : 'none';
    /* pointer-events 管不到键盘：淡到看不见的面板，它的链接照样在 Tab 序列里，
       键盘用户会 Tab 进一片空白然后被送走。必须同时 visibility:hidden。
       visibility 参与了上面的 transition，所以淡出过程仍然看得见 */
    el.style.visibility = vis>0.02 ? 'visible' : 'hidden';
    if(narrow){
      /* 窄屏：面板变成底部抽屉，场景和猫留在上半屏 */
      el.style.left='8px'; el.style.right='8px'; el.style.width='auto';
      el.style.top='auto'; el.style.bottom='46px';
      el.style.setProperty('--px','0px');
    } else {
      var w=el.offsetWidth, hgt=el.offsetHeight;
      el.style.left='0'; el.style.right='auto'; el.style.width='';
      el.style.bottom='auto';
      /* 桌面端落在右侧，但右侧要留出一条【空的竖带】。原来留 6%——实测
         1280 宽只有 77px、1400 宽只有 84px，卡片看着像被顶到边角上，
         右边那一竖条只剩一丝，人眼读到的是"浮窗被挤出去了"而不是
         "页面右边有一栏"。留白提到 15%，并夹在 88..240：
         低于 88 在 1024 屏上又太贴边，高于 240 在超宽屏上卡片会被甩到
         画面正中、左右两片空得一样宽，构图重心就散了 */
      var margin=Math.round(Math.max(88, Math.min(240, vw*0.15)));
      var hi=Math.max(16, vw-w-margin);
      /* 0.72x 慢速视差：按世界位移的 28% 偏移，夹在 ±40px 内。
         1.0x 会让卡片一路贴着道具跑，读起来像画在屏幕上；0 则成了贴边死物。
         0.72 既有"属于这个世界"的感觉，位置又稳得住 */
      var par=Math.max(-40, Math.min(40, (zc-view.camX)*S*0.28));
      var catRight=(CAT_SX+40)*S;
      var lo=Math.max(16, Math.min(catRight+30, hi));
      var x=Math.max(lo, Math.min(hi, hi+par));
      el.style.setProperty('--px',Math.round(x)+'px');
      /* 垂直：顶边对齐上三分线，再夹在地平线之上，不许压到地面 */
      var top=Math.max(64, Math.min(view.vh*0.30, gy-24-hgt));
      el.style.top=Math.round(top)+'px';

      /* 引线：从卡片左缘拉到世界里对应的道具。道具在屏幕外、或者跑到
         卡片右边去的时候就不画——横线穿过卡片底下的那一段没有意义 */
      var ld=PROP_ANCHOR[i]||null, lead=false;
      var grp=document.getElementById('leaders').children[i];
      if(ld){
        var px=(ld[0]-view.camX)*S;
        /* y 要用 (世界y+destY)*S，和 resize() 里 (destY+GROUND)*S=groundY
           同一个约定。原来写成减号，线会落到道具下方两百多像素的空处，
           看起来像指着天。基线取 groundAt 而不是 GROUND：岸边的道具在
           低 24 格的地面上，用 GROUND 会把线抬到半空 */
        var py=(groundAt(ld[0])+ld[1]+view.destY)*S;
        if(px>8 && px<x-40 && (x-px)<vw*0.62 && py>56 && py<gy-4){
          var midY=top+hgt/2;
          grp.children[0].style.left=Math.round(px)+'px';
          grp.children[0].style.top=Math.round(py)+'px';
          grp.children[0].style.width=Math.round(x-px)+'px';
          grp.children[1].style.left=Math.round(x-3)+'px';
          grp.children[1].style.top=Math.round(Math.min(midY,py))+'px';
          grp.children[1].style.height=Math.round(Math.abs(midY-py))+'px';
          grp.children[2].style.left=Math.round(px-2)+'px';
          grp.children[2].style.top=Math.round(py-2)+'px';
          lead=true;
        }
      }
      var leadOn=lead && vis>0.35;
      if(grp.dataset.lead!==String(leadOn)){
        grp.dataset.lead=String(leadOn);
        for(var gi=0;gi<3;gi++) grp.children[gi].style.opacity=leadOn?'1':'0';
      }
    }
    /* 区域名牌跟着世界走 */
    var sp=document.getElementById('sp'+i);
    if(sp){
      var sw=sp.offsetWidth;
      sp.style.transform='translateX('+Math.round((i*ZONE_W+56-view.camX)*S-sw/2)+'px)';
      sp.style.top=Math.round(gy+10)+'px';
      sp.style.opacity=(0.25+0.75*vis).toFixed(3);
    }
  }
}
function goto(i){
  cat.target = i*ZONE_W + SCENE_W/2;
  cat.idle=0; cat.patrol=null; cat.asleep=false;   /* 人工点了导航，猫要醒过来 */
}

/* ============================================================
   面板内容（全部来自 PORTAL，真实链接）
   ============================================================ */
function latin(t){ return String(t).replace(/[A-Za-z][A-Za-z0-9 \-&'.]*/g,function(m){return '<i>'+m+'</i>';}); }

function buildPanels(){
  var H=PORTAL.hero;

  /* ---- 区域 0：小屋 / 出发的夜晚 ---- */
  document.getElementById('p0').innerHTML =
    '<p class="kicker"><i></i>'+H.kicker+'</p>'+
    '<h1>'+H.h1+'</h1>'+
    '<p class="sub">'+H.sub+'</p>'+
    '<p class="lede">'+H.lede+'</p>'+
    '<div class="cta-row">'+
      H.cta.map(function(c){
        return '<a class="btn'+(c.primary?' btn-primary':'')+'" href="'+c.href+'"'
          +(c.primary?' data-go="1"':'')+'>'+(c.primary?'▶ ':'')+c.t+'</a>';
      }).join('')+
    '</div>';

  /* ---- 区域 1：公告栏 / 文章钉在板上 ---- */
  var B=PORTAL.board;
  /* 取【最近】keep 篇，不是最前面 keep 篇。posts 是 createdDate 升序（旧->新），
     原来的 slice(0,keep) 在只有 3 篇时看不出来，等加到第 4 篇就会开始把
     最新的藏进归档 —— 和这段自己的 lede 正好相反。
     pin 原来手写在数据里，现在按显示位置取模：它只被拼成 pin0/1/2 的
     CSS 类做图钉配色，没有语义，所以位置一变也不用改数据。 */
  var shown=PORTAL.posts.slice(Math.max(0,PORTAL.posts.length-B.keep));
  var hidden=Math.max(0,PORTAL.posts.length-B.keep);
  var notes=shown.map(function(p,i){
    return '<li><a class="notice pin'+(i%3)+'" href="'+p.href+'">'+
      '<span class="pinhead"></span>'+
      '<h3>'+latin(p.cn)+'</h3>'+
      '<p class="dsc">'+p.desc+'</p>'+
      '<span class="m"><span class="lab'+(p.lab==='bug'?' bug':'')+'">'+p.lab.toUpperCase()+'</span>'+
        p.date+' · '+p.words+' 字</span>'+
      '<span class="go">▶</span></a></li>';
  }).join('');
  /* 清单空 = 生成物没到位。宁可把 lede 换成一句明确的错，也不要安静地
     渲染一块空板子——那看着像"最近没发文"，实际是数据没加载。 */
  var lede=PORTAL.posts.length
    ? B.lede
    : '文章清单没加载到：assets/posts.js 缺失或为空。它是生成物，请先跑 out/genposts.ps1';
  document.getElementById('p1').innerHTML =
    '<p class="kicker"><i></i>'+B.kicker+'</p>'+
    '<h2>'+B.h2+'</h2>'+
    '<p class="lede">'+lede+'</p>'+
    '<ul class="boardlist">'+notes+'</ul>'+
    '<a class="boardmore" href="'+B.more.href+'">'+
      '<span class="en">'+B.more.en+'</span>'+
      '<span class="cn">'+B.more.cn+(hidden?'（还有 '+hidden+' 篇）':'')+'</span>'+
      '<span class="ds">'+B.more.desc+'</span>'+
    '</a>';

  /* ---- 区域 2：雨桥 / 只留三个时段入口，不铺表格 ---- */
  var G=PORTAL.bridge;
  var ch=PORTAL.channels.map(function(x){
    return '<li><a href="'+x.href+'">'+
      '<span class="when">'+x.when+'</span>'+
      '<span class="en">'+x.en+'</span>'+
      '<span class="cn">'+x.cn+'</span>'+
      '<span class="ds">'+x.desc+'</span>'+
      '<span class="go">▶</span></a></li>';
  }).join('');
  document.getElementById('p2').innerHTML =
    '<p class="kicker"><i></i>'+G.kicker+'</p>'+
    '<h2>'+G.h2+'</h2>'+
    '<p class="lede">'+G.lede+'</p>'+
    '<ul class="chanlist">'+ch+'</ul>'+
    '<p class="foot">'+G.note+'</p>';

  /* ---- 区域 3：岸 / 路的尽头 ---- */
  var S=PORTAL.shore;
  var lk=S.links.map(function(x){
    return '<li><a href="'+x.href+'"'+(x.external?' target="_blank" rel="noopener"':'')+'>'+
      '<span class="en">'+x.en+'</span><span class="cn">'+x.cn+'</span>'+
      '<span class="ds">'+x.desc+'</span></a></li>';
  }).join('');
  document.getElementById('p3').innerHTML =
    '<p class="kicker"><i></i>'+S.kicker+'</p>'+
    '<h2>'+S.h2+'</h2>'+
    '<p class="lede">'+S.lede+'</p>'+
    '<ul class="linklist">'+lk+'</ul>'+
    '<div class="save"><span>© <span id="yr"></span> F1yingCat</span>'+
    '<a href="https://github.com/Meekdai/Gmeek" target="_blank" rel="noopener">GMEEK</a></div>';

  /* 每个面板末尾挂一条"下面还有"的提示。窄屏下行情面板有近六成内容在
     折叠线以下（实测 707px 内容挤在 296px 里），而触屏没有可见滚动条，
     不给信号就等于这部分内容不存在。滚动到底后自动收起 */
  for(var i=0;i<NZ;i++){
    var el=document.getElementById('p'+i), h=document.createElement('div');
    h.className='morehint';
    h.setAttribute('aria-hidden','true');   /* 纯装饰，不能进 Tab 序列 */
    h.textContent='▾ 下滑看更多';
    el.appendChild(h);
    el.addEventListener('scroll',function(){
      this.classList.toggle('at-end', this.scrollTop+this.clientHeight>=this.scrollHeight-4);
    });
  }
  /* 引线的三段，每区一组。放在 #leaders 里（面板的同级）而不是面板内部——
     面板 overflow-x:hidden，画在它盒子之外的部分会被裁掉 */
  var lw=document.getElementById('leaders');
  for(var i=0;i<NZ;i++){
    var grp=document.createElement('div');
    grp.style.cssText='position:absolute;inset:0;pointer-events:none';
    ['leader','leaderStem','leaderDot'].forEach(function(cls){
      var d=document.createElement('i');
      d.className=cls;
      grp.appendChild(d);
    });
    grp.dataset.lead='off';
    lw.appendChild(grp);
  }
  updateScrollHints();
}

/* 面板是否溢出取决于视口高度（max-height 用 vh），所以每次 resize 都要重量 */
function updateScrollHints(){
  for(var i=0;i<NZ;i++){
    var el=document.getElementById('p'+i);
    if(el.scrollHeight-el.clientHeight>4) el.classList.add('has-more');
    else el.classList.remove('has-more');
  }
}

/* ============================================================
   交互
   ============================================================ */
var keys={left:false,right:false}, drag=null;

function wire(){
  addEventListener('keydown',function(e){
    if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a'){ keys.left=true; cat.target=null; e.preventDefault(); }
    if(e.key==='ArrowRight'||e.key.toLowerCase()==='d'){ keys.right=true; cat.target=null; e.preventDefault(); }
    if(e.key>='1'&&e.key<='4') goto(parseInt(e.key,10)-1);
    if(e.key==='Home') goto(0);
    if(e.key==='End') goto(NZ-1);
  });
  addEventListener('keyup',function(e){
    if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a') keys.left=false;
    if(e.key==='ArrowRight'||e.key.toLowerCase()==='d') keys.right=false;
  });
  var cv=view.cv;
  function pos(e){ var r=cv.getBoundingClientRect(); return (e.clientX-r.left)/view.S+view.camX; }
  cv.addEventListener('pointerdown',function(e){
    cat.target=null; drag=pos(e); cv.setPointerCapture(e.pointerId);
  });
  cv.addEventListener('pointermove',function(e){ if(drag!==null) drag=pos(e); });
  cv.addEventListener('pointerup',function(){ drag=null; });
  cv.addEventListener('pointercancel',function(){ drag=null; });
  cv.addEventListener('wheel',function(e){
    e.preventDefault();
    cat.target=null;
    cat.idle=0; cat.patrol=null; cat.asleep=false;   /* 滚轮也算人工操作 */
    cat.x=Math.max(30,Math.min(WORLD_W-30, cat.x+(Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY)*0.9));
  },{passive:false});

  document.getElementById('znav').addEventListener('click',function(e){
    var b=e.target.closest('button[data-i]'); if(!b) return;
    goto(parseInt(b.dataset.i,10));
  });
  document.getElementById('track').addEventListener('click',function(e){
    var b=e.target.closest('button[data-i]'); if(!b) return;
    goto(parseInt(b.dataset.i,10));
  });
  document.addEventListener('click',function(e){
    var a=e.target.closest('[data-go]'); if(!a) return;
    e.preventDefault(); goto(parseInt(a.dataset.go,10));
  });
  var br=document.getElementById('brand');
  br.addEventListener('click',function(e){ e.preventDefault(); goto(0); });

  addEventListener('resize',function(){ layout(); });

  /* 区域名牌：立在路边的像素木牌，跟着世界一起被镜头扫过 */
  ZONES.forEach(function(z,i){
    var sp=document.getElementById('sp'+i);
    var W=32, H=46, mul=4;
    sp.width=W*mul; sp.height=H*mul;
    sp.style.width=(W*mul)+'px'; sp.style.height=(H*mul)+'px';
    var c=sp.getContext('2d'); c.imageSmoothingEnabled=false;
    /* 立柱 */
    c.fillStyle=PAL.k;      c.fillRect(15,36,2,8);
    c.fillStyle=PAL.d;      c.fillRect(15,42,2,2);
    /* 牌面 */
    c.fillStyle=PAL.k;      c.fillRect(0,0,32,38);
    c.fillStyle='#3a2418';  c.fillRect(1,1,30,1);
    c.fillStyle=PAL.d;      c.fillRect(1,36,30,2);
    c.fillStyle=PAL.O;      c.fillRect(1,35,30,1);
    /* 图标 */
    drawSprite(c,z.icon,16,3,2);
  });
}

/* ============================================================
   启动
   ============================================================ */
function boot(){
  var yr=document.getElementById('yr'); if(yr) yr.textContent=new Date().getFullYear();
  view.cv=document.getElementById('cView');
  view.ctx=view.cv.getContext('2d');
  view.world=buildWorld();
  layout();

  var gb=document.getElementById('cBrand');
  gb.width=22; gb.height=22; gb.style.width='22px'; gb.style.height='22px';
  var bc=gb.getContext('2d'); bc.imageSmoothingEnabled=false;
  drawSprite(bc,'cat24',11,11,1);

  document.getElementById('znav').innerHTML = ZONES.map(function(z,i){
    return '<button data-i="'+i+'" aria-current="false">'+z.en+'</button>';
  }).join('');

  /* 时钟。挂在 setInterval 上而不是 frame() 里：frame 是 rAF 驱动的，
     标签页切到后台时 rAF 停摆，时钟会跟着停；setInterval 在后台会被
     节流到 1Hz 一次，正好够用，而且不占每帧的预算。
     窄屏只留 HH:MM —— 420px 宽塞不下日期，日期放在 datetime 属性里，
     读屏和"复制链接"拿到的仍然是完整时间戳 */
  /* 时钟。挂在 setInterval 上而不是 frame() 里：frame 是 rAF 驱动的，
     标签页切到后台时 rAF 停摆，时钟会跟着停；setInterval 在后台会被
     节流到 1Hz 一次，正好够用，而且不占每帧的预算。
     窄屏只留 HH:MM —— 420px 宽塞不下日期，日期放在 datetime 属性里，
     读屏和"复制链接"拿到的仍然是完整时间戳。

     首屏标题面板里那行 "CAT PATROL · HH:MM" 用的是同一份时间，不再是写死的
     23:40。两处都在这里更新，所以这个函数不能关在 IIFE 里——buildPanels()
     在它之后才把 #heroClock 插进 DOM，得从外面能再叫一次。 */
  function p2(n){ return (n<10?'0':'')+n; }
  function tickClock(){
    var ce=document.getElementById('clock');
    var d=new Date(), narrow=innerWidth<=860;
    var hm=p2(d.getHours())+':'+p2(d.getMinutes());
    var iso=d.toISOString().slice(0,19);
    ce.textContent = narrow
      ? hm
      : d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())+' '+hm;
    ce.setAttribute('datetime', iso);
    /* 每次现查：#heroClock 是 buildPanels() 才建出来的，第一次 tick 时还不存在 */
    var he=document.getElementById('heroClock');
    if (he){ he.textContent=hm; he.setAttribute('datetime', iso); }
  }
  tickClock();
  setInterval(tickClock, 1000);
  addEventListener('resize', tickClock);

  /* 底下的进度条刻度：原来是写死在 HTML 里的四个 div（装饰，摸不着）。
     改成真按钮：<b> 是悬停时浮出来的区名，方块本身是 16px 的硬边像素块，
     和画面里的东西同一个语言 */
  document.getElementById('track').insertAdjacentHTML('beforeend',
    ZONES.map(function(z,i){
      return '<button class="pip" data-i="'+i+'" style="left:'+(12.5+i*25)+'%"'
        +' aria-label="走到'+z.cn+'"><b>'+z.cn+'</b></button>';
    }).join(''));

  buildPanels();
  /* 面板里的标题时间刚插进来，立刻补一次，别让它以 --:-- 挂一秒 */
  tickClock();
  wire();

  /* 深链：#z2 / ?z=2 直接把猫放到对应区域（也可分享链接到某个区） */
  var zi=0;
  var m=String(location.hash||'').match(/^#z(\d)$/);
  if(m) zi=parseInt(m[1],10);
  else if(/[?&]z=\d/.test(location.search)) zi=parseInt(location.search.match(/[?&]z=(\d)/)[1],10);
  zi=Math.max(0,Math.min(NZ-1,zi));
  cat.x=zi*ZONE_W+SCENE_W/2;
  view.camX=Math.max(0,Math.min(Math.max(0,WORLD_W-view.viewW), cat.x-CAT_SX));

  syncZone(zi);
  positionPanels();
  requestAnimationFrame(function(t){ cat.blinkAt=t+2; schedule(); });
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
else boot();
</script>
