:root{

  /* 注意：touch-action 不能放在 body 上。触摸手势的允许行为是沿祖先链取
     交集的，body 上写 none 会连带禁掉面板抽屉内部的纵向滚动——而行情面板
     有近六成内容在折叠线以下，那等于在手机上彻底不可达。
     禁手势只需要作用在真正要拖拽的画布上（见 #cView），
     页面本身也已经有 overflow:hidden 挡住平移 */
  overscroll-behavior:none;
}
canvas{display:block}
#cView{touch-action:none}   /* 拖动画布挪猫时不要触发浏览器手势 */
.px-en{font-family:'PS2P',"Courier New",monospace;letter-spacing:.08em;line-height:1.9}

/* ================= 游戏外框 ================= */
.game{position:fixed;inset:0;overflow:hidden;background:#14121c}
#cView{position:absolute;inset:0;width:100%;height:100%}

/* ================= HUD ================= */
.hud{
  position:absolute;left:0;right:0;top:0;z-index:20;
  display:flex;align-items:center;gap:16px;
  padding:11px 20px;
  background:linear-gradient(to bottom,rgba(20,18,28,.92),rgba(20,18,28,.55) 70%,transparent);
  pointer-events:none;
}
.hud > *{pointer-events:auto}
.hud .brand{
  display:flex;align-items:center;gap:9px;
  font-family:'PS2P',monospace;font-size:11px;letter-spacing:.08em;
  color:var(--amber);text-decoration:none;white-space:nowrap;cursor:pointer;
}
.hud .brand canvas{width:22px;height:22px}
.hud .zone-name{
  font-size:14px;color:var(--cream);font-weight:700;white-space:nowrap;
  padding-left:14px;border-left:2px solid var(--dusk);
}
.hud .zone-en{font-family:'PS2P',monospace;font-size:8px;letter-spacing:.12em;color:#9a92b4;display:block}

/* 时钟。用 <time> 而不是 <span>：它带 machine-readable 的 datetime，
   读屏和复制都拿得到完整时间戳，而屏幕上那行字只是给人看的。
   PS2P 是等宽点阵字，冒号和数字同宽，所以不会跳。 */
.clock{
  font-family:'PS2P',monospace;font-size:9px;letter-spacing:.06em;
  color:#9a92b4;white-space:nowrap;margin-left:14px;
  padding-left:14px;border-left:2px solid var(--dusk);
}

/* 时钟紧跟区名，靠右的 auto 留给区导航：于是 HUD 读作
   "这是哪儿" + "现在几点" 在左，"去哪里" 在右。给 clock 也加 auto 的话
   区名和时钟之间会空出 700 多像素，读起来像两块不相干的东西 */
.znav{display:flex;gap:7px;margin-left:auto;flex-wrap:wrap;justify-content:flex-end}
.znav button{
  font-family:'PS2P',monospace;font-size:9px;letter-spacing:.06em;
  color:#9a92b4;background:var(--ink-2);
  border:2px solid var(--dusk);padding:8px 11px;cursor:pointer;
  transition:color .12s,border-color .12s,background .12s;
}
.znav button:hover{color:var(--amber);border-color:var(--amber)}
.znav button[aria-current="true"]{color:var(--ink);background:var(--amber);border-color:var(--amber)}
.znav button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

/* 进度条：猫走到哪儿了。这四个方块同时是跳转按钮——点一下猫就跑过去。
   原来 pointer-events:none + 2x10 的细刻度，纯装饰：看得见、摸不着，
   而它是全画面唯一"知道自己能点"的位置，按钮长在这里最省事 */
.track{
  position:absolute;left:20px;right:20px;bottom:14px;height:4px;z-index:20;
  background:rgba(59,51,80,.8);
}
.track .fill{position:absolute;left:0;top:0;height:100%;background:var(--orange);width:0}
.track .pip{
  position:absolute;top:-6px;width:16px;height:16px;margin-left:-8px;
  padding:0;background:var(--dusk);border:2px solid #15122a;cursor:pointer;
  transition:background .12s,border-color .12s;
}
.track .pip:hover{background:var(--amber);border-color:var(--amber)}
.track .pip.on{background:var(--amber);border-color:var(--amber)}
.track .pip:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
/* 名字平时不显示，悬停/聚焦才浮出来。四个方块只有 16px，
   永远显示文字会盖住场景 */
.track .pip b{
  position:absolute;bottom:19px;left:50%;transform:translateX(-50%);
  font-family:'PS2P',monospace;font-size:8px;font-weight:400;letter-spacing:.1em;
  color:var(--stone);white-space:nowrap;opacity:0;pointer-events:none;
  transition:opacity .12s,color .12s;
}
.track .pip:hover b,.track .pip:focus-visible b{opacity:1;color:var(--amber)}
.hint{
  position:absolute;left:20px;bottom:28px;z-index:20;
  font-family:'PS2P',monospace;font-size:8px;letter-spacing:.1em;
  /* 这是全站唯一的操作说明文字，原来用 --stone(#6b6288) 压在深蓝天空上，
     1:1 下几乎读不出来。提到与面板正文同级的奶白 */
  color:#a49cbe;pointer-events:none;
  text-shadow:1px 1px 0 rgba(0,0,0,.75);
}

/* ================= 世界里的面板 ================= */
.panel{
  position:absolute;left:0;top:0;z-index:10;
  width:430px;
  /* 下限 240px：72vh-86px 在矮视口（横屏手机、很矮的窗口）下会塌到 200px 出头，
     面板只剩一行半还被提示条压住。视口不够高时本来就该滚动，滚动条比
     "只露一条边"体面 */
  max-height:max(240px, calc(72vh - 86px));
  /* overflow-x 必须显式写 hidden：只写 overflow-y:auto 时，CSS 规范会把
     overflow-x 从 visible 计算成 auto，于是任何一点点横向溢出（提示条的
     出血负边距就会造成）都会长出一条 14.8px 的横向滚动条，白白吃掉垂直空间 */
  overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;
  touch-action:pan-y;   /* 抽屉内允许纵向滚动，但不允许横向甩动 */
  background:var(--ink-2);
  border:var(--edge) solid var(--dusk);
  box-shadow:var(--pop);
  --padb:15px;
  padding:16px 18px var(--padb);
  opacity:0;transition:opacity .22s, visibility .22s;
  /* 视差的横向位移走【独立的 translate 属性】，transform 留给 assets/glass.css
     的 3D 倾斜。规范里最终矩阵是 translate × rotate × scale × transform，
     两条动作自动叠成一条，谁也冲不掉谁。
     以前 positionPanels() 每帧直接写 el.style.transform=translateX(...)，
     而 glass.css 的 .glass.tilt 也要写 transform —— 后写的把先写的整条盖掉，
     面板的视差会被冻住。再往前一版把这个位移挂在自定义属性 --glass-x 上，
     想让它排在 transform 最前面，方向对，但自定义属性【会继承】：面板内部的
     纸条卡把同一份位移继承了过去，卡片自己再套一遍，整排卡片被推出面板
     772px、被上面的 overflow-x:hidden 裁掉，公告栏大框只剩标题和正文。
     translate 属性不继承，才是这条位移该待的地方。 */
  translate:var(--px,0px);
}

/* 内容被折叠时的提示条。用 position:sticky 钉在可视区底缘，滚动到底自然落位；
   不做渐变蒙层——整站的美术约定是硬边像素。opacity:0 的面板里的链接
   仍然能被 Tab 到并直接跳走，所以淡出的面板必须同时 visibility:hidden。
   sticky 是相对内容盒定位的，bottom:0 会停在 padding 之上，所以要用
   --padb 把这段内边距抵消掉，否则底下会漏出一条缝 */
.morehint{
  display:none;
  position:sticky;bottom:calc(-1 * var(--padb));z-index:2;
  margin:12px -18px 0;padding:8px 0 7px;
  font-family:'PS2P',monospace;font-size:8px;letter-spacing:.12em;
  text-align:center;color:var(--amber);
  background:var(--ink-2);border-top:2px solid var(--dusk);
}
.panel.has-more:not(.at-end) .morehint{display:block}

/* 引线：把浮窗缝回场景。走直角（横一段 + 一根竖直落线 + 道具上的标记点），
   不走斜线——斜线在这个页面里会读成一道划痕，而且斜线在面板高度变化的
   四个区之间长度会跳。直角的三段都是硬边，和整站的像素语言一致。
   必须是面板的【同级】而不是子元素：面板有 overflow-x:hidden，
   画在它盒子之外的部分会被裁掉 */
.leaders{position:absolute;inset:0;z-index:9;pointer-events:none}
.leader,.leaderStem,.leaderDot{
  position:absolute;pointer-events:none;
  opacity:0;transition:opacity .22s;
}
.leader{height:2px;background:var(--amber)}
.leaderStem{width:2px;background:var(--amber)}
.leaderDot{
  width:6px;height:6px;background:var(--ink);
  border:2px solid var(--amber);
}
.panel.on{opacity:1}
.panel .kicker{
  font-family:'PS2P',monospace;font-size:9px;letter-spacing:.14em;
  color:var(--orange);margin:0 0 8px;display:flex;align-items:center;gap:9px;
}
.panel .kicker i{display:inline-block;width:22px;height:2px;background:var(--orange)}
.panel h2{font-size:28px;color:var(--cream);margin:0 0 8px;line-height:1.25;font-weight:800}
.panel .lede{font-size:14px;color:#a49cbe;margin:0 0 16px;line-height:1.7}

/* 首屏标题面板更大 */
.panel--title{width:520px;--padb:24px;padding:26px 30px 24px}
.panel--title h1{
  font-size:clamp(40px,5vw,60px);line-height:1;margin:0 0 8px;
  color:var(--cream);font-weight:900;letter-spacing:.02em;
  text-shadow:3px 3px 0 var(--orange),6px 6px 0 var(--rust);
}
.panel--title .sub{
  font-family:'PS2P',monospace;font-size:10px;letter-spacing:.16em;
  color:var(--amber);margin:0 0 16px;
}

.cta-row{display:flex;gap:12px;flex-wrap:wrap}
.btn{
  display:inline-flex;align-items:center;gap:9px;
  font-family:'PS2P',monospace;font-size:11px;letter-spacing:.1em;
  padding:13px 20px;text-decoration:none;cursor:pointer;
  border:var(--edge) solid var(--cream);background:var(--ink);color:var(--cream);
  box-shadow:var(--pop-sm);
  transition:transform .08s steps(2),box-shadow .08s steps(2),background .12s;
}
.btn:hover{background:var(--cream);color:var(--ink)}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0}
.btn:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.btn-primary{background:var(--orange);border-color:var(--orange);color:var(--ink)}
.btn-primary:hover{background:var(--amber)}

/* 公告栏：文章 = 钉在板子上的纸条 */
.boardlist{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.boardlist a{
  position:relative;display:block;text-decoration:none;color:inherit;
  padding:20px 14px 13px;background:var(--paper);color:var(--ink);
  border:2px solid #000;box-shadow:3px 3px 0 rgba(0,0,0,.5);
  transition:transform .08s steps(2),box-shadow .08s steps(2);
}
/* 位移交给 assets/glass.css 的 3D 倾斜了。这里只留硬投影变大的那一半：
   卡片现在跟着光标转，位移再叠上去就是双重动效，读起来是"抖"而不是"亮"。 */
.boardlist a:hover{box-shadow:5px 5px 0 rgba(0,0,0,.5)}
.boardlist a:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
/* 图钉：钉头压在纸条上沿 */
.boardlist .pinhead{
  position:absolute;left:12px;top:-4px;width:9px;height:9px;
  background:var(--up);border:2px solid #000;
}
.boardlist a.pin1 .pinhead{background:var(--azure)}
.boardlist a.pin2 .pinhead{background:var(--amber)}
.boardlist h3{margin:0 0 5px;font-size:16px;line-height:1.35;font-weight:800}
.boardlist .dsc{margin:0 0 8px;font-size:12.5px;line-height:1.55;color:#3a3450}
.boardlist .m{font-size:11px;color:#5a5470;display:block}
.boardlist .lab{font-family:'PS2P',monospace;font-size:7px;letter-spacing:.06em;padding:2px 5px;border:1px solid var(--ink);color:var(--ink);margin-right:6px}
.boardlist .lab.bug{border-color:var(--rust);color:var(--rust)}
.boardlist .go{position:absolute;right:13px;bottom:12px;font-family:'PS2P',monospace;font-size:9px;color:var(--rust)}
.boardlist i{font-style:normal;font-family:'PS2P',monospace;font-size:.72em}

/* 归档入口 */
.boardmore{
  display:block;margin-top:11px;padding:11px 13px;text-decoration:none;
  background:var(--ink);border:2px dashed var(--stone);color:var(--paper);
  transition:border-color .12s,background .12s;
}
.boardmore:hover{border-color:var(--amber);background:var(--ink-2)}
.boardmore:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.boardmore .en{font-family:'PS2P',monospace;font-size:7px;letter-spacing:.1em;color:var(--azure);display:block;margin-bottom:4px}
.boardmore .cn{font-size:16px;font-weight:800;color:var(--cream);display:block}
.boardmore .ds{font-size:12px;color:#8b83a8;display:block;margin-top:2px}

/* 雨桥：三个时段入口 */
.chanlist{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.chanlist a{
  display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;
  padding:12px 13px;text-decoration:none;color:inherit;
  background:var(--ink);border:2px solid var(--dusk);
  border-left:4px solid var(--azure);
  transition:border-color .12s,transform .08s steps(2);
}
.chanlist a:hover{border-color:var(--amber);border-left-color:var(--amber)}
.chanlist a:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.chanlist .when{grid-column:1/2;font-family:'PS2P',monospace;font-size:7px;letter-spacing:.06em;color:var(--stone)}
.chanlist .go{grid-column:2/3;grid-row:1/3;font-family:'PS2P',monospace;font-size:9px;color:var(--orange)}
.chanlist .en{grid-column:1/2;font-family:'PS2P',monospace;font-size:7px;letter-spacing:.1em;color:var(--azure)}
.chanlist .cn{grid-column:1/2;font-size:17px;font-weight:800;color:var(--cream);line-height:1.3}
.chanlist .ds{grid-column:1/3;font-size:12px;color:#8b83a8;margin-top:3px}
.foot{font-size:11.5px;color:#7d7599;margin:12px 0 0;line-height:1.6}

/* 行情终端面板 */
.term{background:#06060a;border:2px solid var(--ink);padding:11px 12px;margin:0 0 11px}
.term .sh{font-family:'PS2P',monospace;font-size:10px;letter-spacing:.1em;color:var(--azure);margin:0 0 3px}
.term .ss{font-family:'PS2P',monospace;font-size:8px;letter-spacing:.06em;color:#8b83a8;margin:0 0 12px}
table.q{width:100%;border-collapse:collapse;font-size:12.5px}
table.q th{font-family:'PS2P',monospace;font-size:7px;letter-spacing:.06em;color:#8b83a8;text-align:right;padding:0 0 7px;font-weight:400}
table.q th:first-child{text-align:left}
table.q td{padding:3px 0;text-align:right;color:var(--paper);font-variant-numeric:tabular-nums}
table.q td:first-child{text-align:left}
table.q tbody tr{border-top:1px solid #221d33}
table.q .up{color:var(--up)} table.q .down{color:var(--down)} table.q .flat{color:var(--stone)}
.bars{display:flex;align-items:flex-end;gap:8px;height:38px;margin:8px 0 0;border-bottom:2px solid #221d33}
.barcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.barcol i{display:block;width:11px;min-height:2px}
.barcol i.dash{width:17px;height:3px;background:var(--stone);margin-bottom:1px}
.barcol span{font-family:'PS2P',monospace;font-size:7px;color:#8b83a8;margin-top:4px;white-space:nowrap}
.bw{margin-top:8px;border-top:1px solid #221d33;padding-top:7px}
.bw .bl{font-family:'PS2P',monospace;font-size:7px;color:#8b83a8;letter-spacing:.06em;margin-bottom:6px}
.macro{display:flex;margin-top:8px;border-top:1px solid #221d33;padding-top:8px}
.macro div{flex:1;border-right:1px solid #221d33;padding-right:8px}
.macro div:last-child{border-right:0}
.macro .l{font-family:'PS2P',monospace;font-size:7px;color:#8b83a8;letter-spacing:.04em}
.macro .v{font-size:15px;color:var(--cream);font-weight:700;line-height:1.35;font-variant-numeric:tabular-nums}
.macro .c{font-family:'PS2P',monospace;font-size:7px}

/* 链接行 */
.linklist{list-style:none;margin:0;padding:0;display:grid;gap:9px}
.linklist a{
  display:block;padding:10px 12px;text-decoration:none;color:inherit;
  background:var(--ink);border:2px solid var(--dusk);
  transition:border-color .12s,transform .08s steps(2);
}
.linklist a:hover{border-color:var(--azure)}
.linklist a:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.linklist .en{font-family:'PS2P',monospace;font-size:7px;letter-spacing:.1em;color:var(--azure);display:block;margin-bottom:4px}
.linklist .cn{font-size:17px;font-weight:800;color:var(--cream);display:block;line-height:1.3}
.linklist .ds{font-size:12.5px;color:#a49cbe;display:block;margin-top:2px;line-height:1.55}

.save{
  margin-top:14px;padding-top:12px;border-top:2px solid var(--dusk);
  font-size:12px;color:#8b83a8;display:flex;gap:8px 16px;flex-wrap:wrap;align-items:center;
}
.save a{font-family:'PS2P',monospace;font-size:9px;letter-spacing:.06em;color:var(--paper);text-decoration:none;padding:9px 12px;border:2px solid var(--stone)}
.save a:hover{color:var(--ink);background:var(--amber);border-color:var(--amber)}
.save a:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

/* 区域名牌（世界里的像素招牌） */
.sprite{position:absolute;left:0;top:0;z-index:5;pointer-events:none;opacity:0;transition:opacity .3s;will-change:transform}
.sprite.on{opacity:1}

@media (max-width:860px){
  .panel{width:auto;--padb:13px;padding:14px 15px var(--padb);max-height:max(240px,44vh)}
  .panel--title{width:auto;--padb:18px;padding:18px 20px}
  .panel--title h1{font-size:clamp(28px,7.5vw,38px)}
  .panel h2{font-size:20px}
  .hud{padding:8px 12px;gap:10px}
  .hud .zone-name{display:none}
  .clock{font-size:7px;letter-spacing:0;padding-left:10px;border-left-width:1px}
  .znav button{font-size:8px;padding:6px 8px}
  .hint{display:none}
  .track{left:12px;right:12px;bottom:10px}
  .boardlist a{padding:18px 12px 11px}
  .boardlist h3{font-size:15px}
  .boardlist .dsc{font-size:12px}
  .chanlist a{padding:10px 11px;gap:2px 10px}
  .chanlist .cn{font-size:16px}
  .linklist a{padding:9px 11px}
  .linklist .cn{font-size:16px}
}
@media (prefers-reduced-motion:reduce){.panel,.sprite{transition:none}}

  <div class="panel panel--title" id="p0"></div>

  <canvas class="sprite" id="sp3" aria-hidden="true"></canvas>

  <header class="hud">
    <a class="brand" id="brand" href="#z0"><canvas id="cBrand" aria-hidden="true"></canvas>F1YINGCAT</a>
    <div class="zone-name"><span class="zone-en" id="zoneEn">HOME</span><span id="zoneCn">小屋</span></div>

    <nav class="znav" id="znav" aria-label="区域"></nav>
  </header>

    <div class="fill" id="trackFill"></div>

/* ============================================================
   绘图工具（沿用，精灵全部已验证）
   ============================================================ */
function drawSprite(g,name,ox,oy,mul,alpha,force){
  var rows=SPR[name]; if(!rows) return; mul=mul||1;
  var W=0,i; for(i=0;i<rows.length;i++) W=Math.max(W,rows[i].length);
  var x0=ox-Math.floor((W*mul)/2);
  if(alpha!==undefined) g.save(), g.globalAlpha=alpha;
  for(var y=0;y<rows.length;y++){
    var row=rows[y], yy=oy+y*mul;
    for(var x=0;x<row.length;x++){
      var ch=row.charAt(x);
      if(ch==='.'||!PAL[ch]) continue;
      g.fillStyle=force||PAL[ch];
      g.fillRect(x0+x*mul,yy,mul,mul);
    }
  }
  if(alpha!==undefined) g.restore();
}
var BAYER=[[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];
function skyBands(g,x,y,w,bands){
  for(var i=0;i<bands.length;i++){
    var b=bands[i];
    g.fillStyle=b.c; g.fillRect(x,b.y,w,b.h);
    if(i<bands.length-1 && b.edge){
      var y1=b.y+b.h, e=b.edge;
      g.fillStyle=bands[i+1].c;
      for(var t=0;t<e;t++)
        for(var px=0;px<w;px++)
          if(BAYER[(y1-e+t)&3][px&3]/16<(t+1)/e) g.fillRect(x+px,y1-e+t,1,1);
    }
  }
}
function pixelShadow(g,cx,y,halfW){
  g.fillStyle='rgba(0,0,0,.42)'; g.fillRect(cx-Math.round(halfW*0.62),y,Math.round(halfW*1.24),1);
  g.fillStyle='rgba(0,0,0,.26)'; g.fillRect(cx-Math.round(halfW*0.86),y+1,Math.round(halfW*1.72),1);
  g.fillStyle='rgba(0,0,0,.13)'; g.fillRect(cx-Math.round(halfW),y+2,halfW*2,1);
}
function mulberry(seed){
  return function(){ seed|=0; seed=seed+0x6D2B79F5|0;
    var t=Math.imul(seed^seed>>>15,1|seed);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return ((t^t>>>14)>>>0)/4294967296; };
}
function mix(a,b,t){
  function h(x){return [parseInt(x.substr(1,2),16),parseInt(x.substr(3,2),16),parseInt(x.substr(5,2),16)];}
  var A=h(a),B=h(b);
  return 'rgb('+Math.round(A[0]+(B[0]-A[0])*t)+','+Math.round(A[1]+(B[1]-A[1])*t)+','+Math.round(A[2]+(B[2]-A[2])*t)+')';
}

  var main = layer(WORLD_W,WORLD_H);
  var fore = layer(FORE_W, WORLD_H);

  /* ==========================================================
     天空：每区一张，各自成图。天空不做视差层——0.15x 的移动
     远小于区域间距 640，用一张 2560 宽的天空铺四次会让各区的
     天空和地面对不上。改成按当前区域选图 + 边界交叉淡入。
     ========================================================== */

  /* z0 / z1：晴夜，星星 + 云 */
  for(z=0;z<2;z++){
    c=skys[z].c;
    skyBands(c,0,0,SKY_W,[
      {y:0,   h:92, c:'#0f0d18', edge:3},
      {y:92,  h:52, c:'#1a1626', edge:3},
      {y:144, h:56, c:'#241f31', edge:0}
    ]);
    for(i=0;i<210;i++){
      c.fillStyle=(i%3===0)?PAL.c:PAL.w;
      c.fillRect(Math.floor(rnd()*SKY_W),Math.floor(rnd()*rnd()*176),1,1);
    }
    /* 几颗亮星带十字光芒 */
    [[90,34],[268,20],[446,44],[706,16],[900,40],[168,120],[880,110]].forEach(function(s){
      c.fillStyle=PAL.c; c.fillRect(s[0],s[1],3,3);
      c.fillStyle=PAL.w;
      c.fillRect(s[0]-2,s[1]+1,7,1); c.fillRect(s[0]+1,s[1]-2,1,5);
    });
    [[300,58,120,4],[520,72,84,3],[150,76,92,3],[680,64,104,4],[940,56,110,3]].forEach(function(q){
      for(var cb=0;cb<q[3];cb++){
        c.fillStyle=mix('#241f31','#6b6288',.20+cb*0.17);
        c.fillRect(q[0],q[1]+cb,Math.round(q[2]*(1-cb/(q[3]+1))),1);
      }
    });
    /* 地平线上的暖色雾：城市把夜空染黄，这是 z0/z1 的色温身份 */
    for(var hz=0;hz<26;hz++){
      c.fillStyle=mix('#241f31','#7a5330',(26-hz)/26*0.55);
      c.fillRect(0,164+hz,SKY_W,1);
    }
  }

  /* z2：暴风雨夜。云层压得很低，整片天压成冷灰蓝 */
  c=skys[2].c;
  skyBands(c,0,0,SKY_W,[
    {y:0,   h:104, c:'#0b0e18', edge:4},
    {y:104, h:56,  c:'#151d2e', edge:4},
    {y:160, h:40,  c:'#1e2b40', edge:0}
  ]);
  /* 翻涌的雨云：多层横向硬边堆叠，不做任何柔化 */
  for(i=0;i<7;i++){
    var cy=26+i*13, cw=420+Math.floor(rnd()*420), cx=Math.floor(rnd()*SKY_W);
    c.fillStyle=mix('#0b0e18','#3d5570',.10+i*0.055);
    c.fillRect(cx,cy,cw,7);
    c.fillStyle=mix('#0b0e18','#3d5570',.06+i*0.04);
    c.fillRect(cx+18,cy+7,Math.round(cw*0.8),4);
  }
  /* 云缝里透出的一点光 */
  c.fillStyle='#2b3d55';
  for(i=0;i<9;i++) c.fillRect(120+i*104, 88+((i*37)%22), 26, 2);
  /* 冷色地平线：暴雨把暖光全压掉了 */
  for(var hz2=0;hz2<24;hz2++){
    c.fillStyle=mix('#1e2b40','#0a1018',(24-hz2)/24*0.7);
    c.fillRect(0,166+hz2,SKY_W,1);
  }

  /* z3：雨停，云散，靠近水面所以天压得低、水汽重 */
  c=skys[3].c;
  skyBands(c,0,0,SKY_W,[
    {y:0,   h:84,  c:'#0b0e16', edge:5},
    {y:84,  h:48,  c:'#141b28', edge:5},
    {y:132, h:68,  c:'#1d2838', edge:0}
  ]);
  for(i=0;i<120;i++){
    c.fillStyle=(i%4===0)?PAL.c:PAL.w;
    c.fillRect(Math.floor(rnd()*SKY_W),Math.floor(rnd()*rnd()*124),1,1);
  }
  /* 云：每一朵都由几级阶梯堆出来，底边才是弧线而不是一根直条 */
  for(i=0;i<6;i++){
    var cx2=Math.floor(rnd()*SKY_W), cy2=16+i*9;
    var steps=[[0,150,6],[26,190,5],[62,214,4],[104,200,3],[142,150,2]];
    for(var s2=0;s2<steps.length;s2++){
      var w2=steps[s2][0], ww2=steps[s2][1], hh2=steps[s2][2];
      c.fillStyle=mix('#0b0e16','#3b4a60',.10+s2*0.045);
      c.fillRect(cx2+w2,cy2-s2*0,ww2,hh2);
    }
    /* 云底再压一道更暗的边，做出厚度 */
    c.fillStyle='#0a0d14';
    c.fillRect(cx2,cy2+6,steps[0][1],2);
  }
  /* 雨停了，地平线是灰白的——这一区整片开阔，和前面三区的重色相反 */
  for(var hz3=0;hz3<30;hz3++){
    c.fillStyle=mix('#1d2838','#5d6c82',(30-hz3)/30*0.62);
    c.fillRect(0,160+hz3,SKY_W,1);
  }

  /* ==========================================================
     远景层（0.45x）：各区内容摆在 farX(z)
     ========================================================== */
  c=far.c;

  /* z0：远处的小镇屋顶——和近景的小屋是同一个世界 */
  (function(){
    var o=farX(0);
    /* 月亮画在这一层而不是天空层：天空每 1024 单位平铺一次，短视口下会
       平铺出两个月亮。far 层不平铺，且自带 0.45x 视差，停在这里最自然。
       far-x 142：zone 0 起始 camX≈226，减掉视差后落在屏幕左上角 */
    var mx=142,my=42,mr=18;
    for(var yy=-mr;yy<=mr;yy++) for(var xx=-mr;xx<=mr;xx++){
      var d=xx*xx+yy*yy; if(d>mr*mr) continue;
      var col=PAL.c;
      if(d>(mr-1.5)*(mr-1.5)) col=PAL.O;
      if((xx+5)*(xx+5)+(yy+4)*(yy+4)<10) col=PAL.stone;
      if((xx-6)*(xx-6)+(yy-3)*(yy-3)<7)  col=PAL.stone;
      c.fillStyle=col; c.fillRect(mx+xx,my+yy,1,1);
    }
    for(i=0;i<7;i++){
      var hx=o-40+i*96, hw=54+Math.floor(rnd()*22), hh=34+Math.floor(rnd()*26);
      c.fillStyle='#161226'; c.fillRect(hx,GROUND-hh,hw,hh);
      c.fillStyle='#0d0b13'; c.fillRect(hx,GROUND-hh,hw,2);
      /* 坡屋顶 */
      for(var k=0;k<7;k++) c.fillRect(hx-4+k,GROUND-hh-1-k,hw+8-k*2,1);
      /* 几扇亮着的窗 */
      for(var wy=GROUND-hh+8;wy<GROUND-8;wy+=10)
        for(var wx=hx+7;wx<hx+hw-6;wx+=11)
          if(rnd()>.6){ c.fillStyle=(rnd()>.7)?PAL.O:PAL.r; c.fillRect(wx,wy,3,4); }
    }
  })();

  /* z1：暖。钠灯把整条街染成琥珀色——这是一条住着人的街 */
  (function(){
    var o=farX(1);
    c.fillStyle='#2a1f2e'; c.fillRect(o-30,GROUND-30,SCENE_W*0.9,30);
    c.fillStyle='#33242e'; c.fillRect(o-30,GROUND-24,SCENE_W*0.9,10);
    for(i=0;i<4;i++){
      var tx=o+30+i*150, th=44+Math.floor(rnd()*20);
      c.fillStyle='#1c1622'; c.fillRect(tx-2,GROUND-12,4,12);
      for(var r2=0;r2<5;r2++)
        c.fillRect(tx-11-Math.round(r2*1.6),GROUND-16-r2*Math.round(th/5),22+r2*3,Math.round(th/5));
    }
    for(i=0;i<5;i++){
      var hx2=o+70+i*124, hw2=40+Math.floor(rnd()*22), hh2=44+Math.floor(rnd()*26);
      c.fillStyle='#1f1724'; c.fillRect(hx2,GROUND-hh2,hw2,hh2);
      c.fillStyle='#2b1f2c'; c.fillRect(hx2,GROUND-hh2,hw2,2);
      for(var wy2=GROUND-hh2+6;wy2<GROUND-5;wy2+=7)
        for(var wx2=hx2+5;wx2<hx2+hw2-5;wx2+=8)
          if(rnd()>.36){ c.fillStyle=(rnd()>.62)?'#ffd98a':PAL.O; c.fillRect(wx2,wy2,3,3); }
    }
  })();

  /* z2：冷。钢灰的楼、稀得多的窗、整片压向蓝——暴雨把城市抽走了颜色。
     天际线只排 4 栋：far 层被压到 0.45x，z2 的可视窗口是 far-x 665..1025，
     而 z3 的窗口是 844..1204。原来排 9 栋一直铺到 1250，越过 farX(3)=864
     整片盖在 z3 头上，"前面全是水"读不出来。收到 840 收在界内，
     从 z3 看只剩最左边一栋退到身后——那正好是"城到头了"的收尾。 */
  (function(){
    var o=farX(2);
    c.fillStyle='#0f1725'; c.fillRect(o-40,GROUND-16,SCENE_W*0.95,16);
    for(i=0;i<4;i++){
      var bx3=o-60+i*82, bw3=44+Math.floor(rnd()*34), bh3=48+Math.floor(rnd()*58);
      c.fillStyle='#101a2b'; c.fillRect(bx3,GROUND-bh3,bw3,bh3);
      c.fillStyle='#0a1119'; c.fillRect(bx3,GROUND-bh3,bw3,1);
      for(var wy3=GROUND-bh3+6;wy3<GROUND-6;wy3+=9)
        for(var wx3=bx3+5;wx3<bx3+bw3-5;wx3+=9)
          if(rnd()>.74){ c.fillStyle=(rnd()>.5)?'#7d93b4':PAL.O; c.fillRect(wx3,wy3,2,2); }
    }
    /* 最后一根信号塔：留在界内，从 z3 看是城最后退过去的一个剪影 */
    c.fillStyle='#0b1220'; c.fillRect(o+300,GROUND-124,22,124);
    c.fillStyle='#101a2b'; c.fillRect(o+292,GROUND-132,38,9);
    c.fillStyle=PAL.up;  c.fillRect(o+309,GROUND-120,4,4);
  })();

  /* z3：空。桥那头是开阔水面，远景只剩一条地平线和几点渔火——
     三个场景里只有这里是"没有城市"的，留白本身就是这一区的性格 */
  (function(){
    var o=farX(3);
    c.fillStyle='#1a2434'; c.fillRect(o-60,GROUND-3,SCENE_W*0.9,3);
    for(i=0;i<11;i++){
      var rx=o-40+i*104, rw=22+Math.floor(rnd()*30), rh=3+Math.floor(rnd()*7);
      c.fillStyle='#141d2a';
      c.fillRect(rx+4,GROUND-1-rh,rw-8,rh);
      c.fillRect(rx,GROUND-1-Math.round(rh*0.4),rw,Math.round(rh*0.4)+1);
    }
    for(i=0;i<4;i++){
      c.fillStyle=(i%2)?PAL.O:'#8fa6c4';
      c.fillRect(o+90+i*230, GROUND-5-Math.floor(rnd()*4), 2, 2);
    }
  })();

  /* 过渡带的远景：z2 的高楼在 far-x 1128 收住，z3 的地平线 1236 才起，
     中间空 108。空着的话从桥上望过去是"城没了"，补一段矮仓库和围栏，
     读起来才是"城到头了，往外就是水" */
  (function(){
    var a=farX(2)+264, b=farX(3)-60, w=b-a;
    /* 地面带：把两区之间的地平线接上 */
    c.fillStyle='#1a2434'; c.fillRect(a-40,GROUND-3,w+80,3);
    c.fillStyle='#141d2a'; c.fillRect(a-40,GROUND,w+80,2);
    /* 两座矮仓库 + 一段围栏，高度一路压低 */
    for(i=0;i<2;i++){
      var wx4=a+8+i*52, ww4=30+Math.floor(rnd()*12), wh4=20-Math.floor(rnd()*6);
      c.fillStyle='#111a29'; c.fillRect(wx4,GROUND-wh4,ww4,wh4);
      c.fillStyle='#0a1119'; c.fillRect(wx4,GROUND-wh4,ww4,2);
      c.fillStyle='#7d93b4'; c.fillRect(wx4+6,GROUND-wh4+8,3,3);
    }
    for(i=0;i<7;i++){
      c.fillStyle='#141d2a'; c.fillRect(a+112+i*14,GROUND-9,3,9);
    }
    c.fillStyle='#1a2434'; c.fillRect(a+112,GROUND-8,96,2);
    /* 最靠外的一小段堤：城到这里就彻底断了 */
    c.fillStyle='#0f1725'; c.fillRect(b-26,GROUND-14,30,14);
    c.fillStyle='#0a1119'; c.fillRect(b-26,GROUND-14,30,2);
    c.fillStyle='#8fa6c4'; c.fillRect(b-18,GROUND-11,3,3);
  })();

  /* ==========================================================
     主层（1.00x）：地面 + 各区道具，猫就走在这上面
     ========================================================== */
  c=main.c;

  /* 这三个要排最前面：路面分段、滩、钓鱼台、逐帧的小鱼都依赖它们 */
  var SG=SHORE_Y, SHORE_X=3*ZONE_W+60, WATER_X=3*ZONE_W+540;

  /* ============================================================
     地面：整条世界【一条路】
     ------------------------------------------------------------
     这里改过两次都被否。两次的错法是一样的：z0 是草皮加一条土路、z1 是
     人行道、T1 用 surf() 铺四段、z2 再来一次人行道加碎石加桥台加木栈道。
     每一换一次材质就多一根垂直硬边，缝上压什么都读成"三块贴图拼起来"。
     问题不在画法，在"过渡 = 换脚下的贴图"这个思路本身。

     这次换的是思路：整条世界只有【一条】路，形式完全一致——
     受光唇 → 6 行面层 → 压边暗线 → 两档土层，七种材质共用这一套骨架。
     材质相接处不切一刀，而是让两种材料互相伸进对方（双向咬合齿），
     再压一道 1 像素暗缝。于是接缝是"混"在一起的，读不出来是一刀切的。

     那么过渡是什么？过渡是路【两旁】的东西在换。脚下从头到尾都在，
     所以"从家到街上"不是一次替换，是一次延续——这正是用户要的那个
     "前后连贯"。唯一的地面高度变化留给 T3 那四级台阶，台阶也用同一套
     road() 按级铺，所以连"往下走"都不例外。
     ============================================================ */
  var RH=6;                                /* 面层行数，全世界统一 */
  var MAT={
    grass :{face:'#2f5648',f2:'#26483d',lip:'#3d6b58',edge:'#1b3129',u1:'#1e3a34',u2:'#16282a',tex:0},
    dirt  :{face:'#3a3226',f2:'#332c22',lip:'#4d4232',edge:'#241f19',u1:'#2a2419',u2:'#1e1a14',tex:1},
    pave  :{face:'#39404a',f2:'#2b3038',lip:'#454d58',edge:'#1e2228',u1:'#252a31',u2:'#1a1e23',tex:2},
    gravel:{face:'#3a3f42',f2:'#343a3c',lip:'#4c5257',edge:'#262b30',u1:'#2f353d',u2:'#252a31',tex:3},
    stone :{face:'#4a4f57',f2:'#3d434b',lip:'#5b636e',edge:'#22272e',u1:'#2e333a',u2:'#24282e',tex:4},
    wood  :{face:'#3f3a2c',f2:'#3a3527',lip:'#5c5442',edge:'#241f19',u1:'#2e2a20',u2:'#221e17',tex:5},
    rock  :{face:'#3a3630',f2:'#33302b',lip:'#4a453c',edge:'#24211c',u1:'#2e2b26',u2:'#232019',tex:6}
  };
  /* 面层纹理。像素里的材质靠重复的短笔画读出来，不是靠底色：
     草是一根根短竖，石板是一格一格的缝，木头是一道道竖缝。
     每一笔都取整，全部不透明——底色相近的两种材质，光换底色是读不出来的。

     铁律：所有笔画一律从 top+1 起，不许碰 top 那一行。
     top 是受光唇，整条路唯一的连续受光线。实测（探针扫 380 格路面）
     石板缝和木板缝都是从 top 画起的，于是受光唇被打成了一排 41 亮度的
     暗点，整条路读成虚线——"一条连续的路"这件事被纹理自己毁掉了。
     纹理是材质的细节，唇边是路的形式，后者优先。 */
  function texGrass(x,w,top){
    for(var q=0;q<Math.floor(w/4);q++){
      var tx=x+Math.floor(rnd()*w);
      c.fillStyle=rnd()>.5?'#35604f':'#2b4034';
      c.fillRect(tx,top+1+Math.floor(rnd()*(RH-1)),1,1+Math.floor(rnd()*2));
    }
  }
  function texGrain(x,w,top){
    for(var q=0;q<Math.floor(w/2);q++){
      var tx=x+Math.floor(rnd()*w);
      c.fillStyle=rnd()>.5?'#4a4030':'#332c22';
      c.fillRect(tx,top+1+Math.floor(rnd()*(RH-1)),1,1);
    }
  }
  /* 石板：竖缝 18 一道、中间一道横缝。缝要压到底色上而不是只靠底色差，
     远看是一条道、近看是一块块砖，两个尺度都读得出来 */
  function texPave(x,w,top){
    c.fillStyle='#252a31';
    for(var q=0;q<w;q+=18) c.fillRect(x+q,top+1,1,RH-1);
    c.fillRect(x,top+3,w,1);
  }
  function texGravel(x,w,top){
    for(var q=0;q<Math.floor(w/2);q++){
      var tx=x+Math.floor(rnd()*w);
      c.fillStyle=rnd()>.5?'#4a5054':'#2f3538';
      c.fillRect(tx,top+1+Math.floor(rnd()*(RH-1)),1+Math.floor(rnd()*2),1);
    }
  }
  /* 砌石：三层横缝，竖缝逐层错半格。横竖都对齐的话整片读成条纹 */
  function texBrick(x,w,top){
    for(var k=0;k<3;k++){
      var y0=top+1+k*2;
      if(y0+2>top+RH) break;
      c.fillStyle='#232830';
      c.fillRect(x,y0+1,w,1);
      for(var q=(k%2)?7:3;q<w;q+=14) c.fillRect(x+q,y0,1,2);
    }
  }
  function texPlank(x,w,top){
    c.fillStyle='#2e2a20';
    for(var q=0;q<w;q+=13) c.fillRect(x+q,top+1,1,RH-1);
  }
  function texRock(x,w,top){
    for(var q=0;q<Math.floor(w/3);q++){
      var tx=x+Math.floor(rnd()*w);
      c.fillStyle=rnd()>.5?'#4a453c':'#565046';
      c.fillRect(tx,top+1+Math.floor(rnd()*(RH-1)),1+Math.floor(rnd()*3),1+Math.floor(rnd()*2));
    }
  }
  var TEX=[texGrass,texGrain,texPave,texGravel,texBrick,texPlank,texRock];
  function road(x0,x1,top,m){
    var w=x1-x0; if(w<=0) return;
    c.fillStyle=m.u2; c.fillRect(x0,top+RH+1,w,Math.max(0,WORLD_H-top-RH-1));
    c.fillStyle=m.u1; c.fillRect(x0,top+RH,w,Math.max(0,Math.min(13,WORLD_H-top-RH)));
    c.fillStyle=m.face;c.fillRect(x0,top,w,RH);
    c.fillStyle=m.f2;  c.fillRect(x0,top+2,w,RH-2);
    c.fillStyle=m.lip; c.fillRect(x0,top,w,1);        /* 受光唇：和上面的空气分开 */
    c.fillStyle=m.edge;c.fillRect(x0,top+RH,w,1);    /* 压边暗线：面层和土层分开 */
    TEX[m.tex](x0,w,top);
  }
  /* 两种材质的接缝。像素里最忌"一刀切"的直边——那读成两块贴图的边界。
     这里让两种材料互相伸进对方：一边每隔几格探出去一格，另一边反过来，
     齿的位置按下标哈希错开（等距就成了梳子），缝心压一道 1 像素暗线。
     结果是接缝处两种材质混在一起，看不出是从哪一格开始换的 */
  function seam(x,top,mA,mB,sp){
    sp=sp||9;
    c.fillStyle=mA.edge; c.fillRect(x-1,top,1,RH+1);
    c.fillStyle=mB.edge; c.fillRect(x,  top,1,RH+1);
    for(var k=0;k<8;k++){
      var h=(k*2654435761)>>>0;
      var dy=top+1+((h>>>5)%(RH-1));
      c.fillStyle=mA.face; c.fillRect(x+2+((h>>>9)%sp), dy, 1+((h>>>13)%3), 1);
      c.fillStyle=mB.face; c.fillRect(x-3-((h>>>3)%sp), dy+((h>>>11)%2), 1+((h>>>17)%3), 1);
    }
    c.fillStyle=mA.lip; c.fillRect(x-5,top,4,1);
    c.fillStyle=mB.lip; c.fillRect(x+2,top,4,1);
  }

  /* 一条路走到底。七种材质、五个接缝，全都在同一条顶边上。
     桥面（wood）和岸（rock）之间不预铺——那段是 T3 的四级台阶，
     它也是用 road() 画的，只是 top 一级级变小 */
  var BR_AB=1812, BR_TOP_W=64;          /* 桥台顶面：路面从它上面长出来 */
  road(0,556,GROUND,MAT.grass);         /* 院子草皮 */
  seam(556,GROUND,MAT.grass,MAT.dirt);
  road(556,640,GROUND,MAT.dirt);        /* 夯土只留门口这 84 格 */
  seam(640,GROUND,MAT.dirt,MAT.gravel);
  road(640,960,GROUND,MAT.gravel);      /* T1 院子→街：碎石路 */
  seam(960,GROUND,MAT.gravel,MAT.pave);
  road(960,BR_AB,GROUND,MAT.pave);      /* 石板：一路铺过 z1 整条街和 T2 */
  seam(BR_AB,GROUND,MAT.pave,MAT.stone);
  road(BR_AB,BR_AB+BR_TOP_W,GROUND,MAT.stone);  /* 桥台顶面：错缝砌石 */
  seam(BR_AB+BR_TOP_W,GROUND,MAT.stone,MAT.wood);
  road(BR_AB+BR_TOP_W,2*ZONE_W+SCENE_W,GROUND,MAT.wood);   /* 木栈道桥面 */
  road(STAIR_B,WATER_X,SHORE_Y,MAT.rock);                   /* 礁石滩 */
  /* 院子里的那条土路还在，但不再是"另一个地面"——它是草皮上压出来的一道
     踩实的带子，和路面共用受光唇和压边暗线，只到 556 就收住：
     剩下的路交给碎石。原来它一路铺到 760，于是 T1 整段都是褐色的土，
     材质不统一读起来像两段路硬拼的 */
  (function(){
    /* 起点从 190 挪到 236（屋门口）。原来这条路从 190 就开始，于是篱笆
       从 42 接到屋左墙的那一段（44..234）会横在土路上。现在这一段是
       草地，篱笆落在草上，院子才真的是被围起来的 */
    var rx0=236, rw=556-rx0;
    c.fillStyle=MAT.dirt.f2; c.fillRect(rx0,GROUND,RH,0);
    c.fillStyle=MAT.dirt.face; c.fillRect(rx0,GROUND,rw,RH);
    c.fillStyle=MAT.dirt.f2;  c.fillRect(rx0,GROUND+2,rw,RH-2);
    c.fillStyle=MAT.dirt.lip; c.fillRect(rx0,GROUND,rw,1);
    c.fillStyle=MAT.dirt.edge;c.fillRect(rx0,GROUND+RH,rw,1);
    texGrain(rx0,rw,GROUND);
    /* 路面边上被草吃掉的两侧：不是切一刀，是草一格一格探进来 */
    for(var q2=0;q2<rw/2;q2++){
      var hh2=(q2*2654435761)>>>0;
      var sy2=GROUND+1+((hh2>>>5)%(RH-1));
      if(q2<16||q2>rw/2-16){
        c.fillStyle=MAT.grass.face; c.fillRect(rx0-((hh2>>>9)%14), sy2, 1+((hh2>>>13)%3), 1);
        c.fillStyle=MAT.grass.face; c.fillRect(rx0+rw-1+((hh2>>>3)%14), sy2, 1+((hh2>>>17)%3), 1);
      }
    }
    c.fillStyle=MAT.grass.lip;
    c.fillRect(rx0-14,GROUND,13,1); c.fillRect(rx0+rw+1,GROUND,13,1);
  })();

  /* z2 桥面：木板桥，桥墩撑在河里。
     桥面到水面之间原来有 26 像素谁都没画——那片近黑被读成"渲染漏了一块"，
     雨桥底下根本看不见河。所以先拿"桥影"把桥下整条填满（有硬边分层，
     不是渐变），水面再从 GROUND+34 提到 GROUND+26：桥墩矮到 18，
     露出来的水面从 15 像素变成 25 像素左右 */
  c.fillStyle='#0e1a26';
  c.fillRect(2*ZONE_W,GROUND+8,SCENE_W,WORLD_H-GROUND-8);
  c.fillStyle='#132234';
  c.fillRect(2*ZONE_W,GROUND+8,SCENE_W,9);
  c.fillStyle='#0b141d';
  c.fillRect(2*ZONE_W,GROUND+17,SCENE_W,9);
  /* 桥面本身已经在上面用 road() 铺成木栈道了。这里只补桥下的暗部——
     它必须盖住 road() 铺下去的土层，所以画在 road 之后。桥面底面以下
     那一段不能是土色，不然会读成"桥埋在一堆土里" */
  c.fillStyle='#241f19'; c.fillRect(2*ZONE_W,GROUND+7,SCENE_W,1);
  /* 桥墩 */
  for(i=0;i<SCENE_W;i+=160) c.fillRect(2*ZONE_W+i+60,GROUND+8,10,18);
  /* 桥台正面：路面从这块砌石上长出来。原来是 masonry 铺在 1794-1858 的
     顶面上，那块"台子"和路面齐平、读不出高度；现在让它从面层底边往下
     56 格，桥面才真的架在一座桥台上 */
  masonry(BR_AB,BR_TOP_W,GROUND+RH+1,8,7,['#2b3038','#262c34','#2f353d','#232830']);
  c.fillStyle='#454c55'; c.fillRect(BR_AB-2,GROUND+RH+1,BR_TOP_W+4,2);
  c.fillStyle='#5b636e'; c.fillRect(BR_AB-2,GROUND+RH+1,BR_TOP_W+4,1);

  /* 岸：楼梯落完之后是礁石滩，之后全是海。滩面已经在上面用 road() 按
     MAT.rock 铺好了（top=SHORE_Y），这里不再重复画一遍。 */
  var SHORE_X=3*ZONE_W+60, WATER_X=3*ZONE_W+540;
  /* 滩上零散的乱石：面层上那层石块纹理是 1-3 格的小点，缺一点立起来的
     东西，脚下的地就还是平的。补一排 3-6 高的石块 */
  for(i=0;i<54;i++){
    var sx3=STAIR_B+Math.floor(rnd()*(WATER_X-40-STAIR_B));
    var sh3=3+Math.floor(rnd()*5), sw3=3+Math.floor(rnd()*6);
    c.fillStyle=rnd()>.5?'#4a453c':'#565046';
    c.fillRect(sx3,SHORE_Y-sh3,sw3,sh3);
    c.fillStyle='#6b6a5e'; c.fillRect(sx3,SHORE_Y-sh3,sw3,1);
    c.fillStyle='#2a2721'; c.fillRect(sx3,SHORE_Y-1,sw3,1);
  }
  /* 水面：越往下越深，横向的波纹要长短交错，不然就是一排条码 */
  function water(x0,w,top){
    var deep=WORLD_H-top;
    c.fillStyle='#1b3350'; c.fillRect(x0,top,w,deep);
    /* 三段由浅到深的硬边分层，不做任何渐变。最深那档原来压到 #122236，
       夜里看下去和"没画"分不出来——桥下和落石底下都会读成一块破洞。
       整体提亮一档：水仍然明显暗于滩地，但还认得出是水 */
    c.fillStyle='#1a2f47'; c.fillRect(x0,top+Math.round(deep*0.34),w,deep);
    c.fillStyle='#17293e'; c.fillRect(x0,top+Math.round(deep*0.70),w,deep);
    c.fillStyle='#223f5c'; c.fillRect(x0,top,w,1);
    for(var r3=0;r3<Math.floor(deep/3);r3++){
      var wy4=top+1+r3*3;
      /* 水纹的最亮一档原来压到 #2a4d6b，和鱼尾鳍的 #2a5170 只差一格亮度，
         鱼一游过去尾巴就和身后的水纹连成一条线。压暗一档之后，
         水里最亮的东西变成了鱼 —— 这本来就该是这个区的视觉重心 */
      if(r3%3===0) c.fillStyle='#1f3c54';
      else if(r3%3===1) c.fillStyle='#182f47';
      else c.fillStyle='#22435c';
      for(var rx3=0;rx3<w;rx3+=9){
        if(rnd()>.52){
          var len=2+Math.floor(rnd()*7);       /* 长短交错 */
          c.fillRect(x0+rx3+Math.floor(rnd()*7),wy4,len,1);
        }
      }
    }
  }
  /* 河只铺桥下那一段（1920→2560）。原来连过渡带一起铺，于是台阶是站在
     水里的；现在台阶落到岸面，河也就该在桥尾收住 */
  water(2*ZONE_W,SCENE_W,GROUND+26);
  water(WATER_X,WORLD_W-WATER_X,SG);

  /* 雨点砸在河面上的圈。这是雨桥，可水面原来是三块纯色，读不出是"水"
     还是"一块深色"。雨点该在河上留痕，桥墩也该在水里有个倒影——
     两样都是硬边像素，不碰渐变。涟漪只铺水面附近这一段：再往下就
     出了视口，画了也看不见 */
  function ripple(px,py,w5){
    if(w5){
      c.fillRect(px+1,py,3,1); c.fillRect(px+2,py+1,1,1);
      c.fillRect(px,py+1,1,1);   c.fillRect(px+4,py+1,1,1);
      c.fillRect(px+1,py+2,3,1);
    } else {
      c.fillRect(px+1,py,1,1); c.fillRect(px,py+1,1,1); c.fillRect(px+2,py+1,1,1);
    }
  }
  var RVW=SCENE_W;
  for(i=0;i<Math.floor(RVW/24);i++){
    var rxp2=2*ZONE_W+6+Math.floor(rnd()*(RVW-12));
    var ryp2=GROUND+27+Math.floor(rnd()*30);
    c.fillStyle = ryp2>GROUND+38 ? '#2a4d6b' : '#35617f';
    ripple(rxp2,ryp2, rnd()>.45);
  }
  /* 桥墩倒影：水面往下压两道越拉越淡的竖影 */
  for(i=0;i<SCENE_W;i+=160){
    var pfx=2*ZONE_W+i+60;
    c.fillStyle='#0a1a2c'; c.fillRect(pfx+1,GROUND+26,8,12);
    c.fillStyle='#122b44'; c.fillRect(pfx+2,GROUND+38,6,7);
  }
  /* 桥影在水里的那一条：水面线要压一道暗边，不然桥墩像浮在水面上 */
  c.fillStyle='#0a1622'; c.fillRect(2*ZONE_W,GROUND+26,RVW,1);

  /* ---- 三段过渡带 ------------------------------------------------
     每个区 = SCENE_W 场景 + TRANS_W 过渡带，四个场景因此各占 640，
     剩下的 320 是"从这儿走到那儿"的路。不做的话每处接缝都是一根
     垂直硬边，四个场景一眼就是四个盒子；做了之后接缝读成"地形在变"。
     像素画的语言里该用阶梯：一级一级落下去，而不是贴图切一刀。 */
  function bank(x,w,top,steps,stepH,cols){
    for(var s=0;s<steps;s++){
      c.fillStyle=cols[s%cols.length];
      c.fillRect(x+s*(w/steps),top+s*stepH,Math.ceil(w/steps)+1,WORLD_H);
    }
  }

  /* 砌石：竖缝逐层错开。横线对齐、竖缝也对齐的话整片读成条纹；
     竖缝错半格才是砌出来的墙 */
  function masonry(x,w,top,courses,ch,cols){
    for(var k=0;k<courses;k++){
      var y0=top+k*ch;
      c.fillStyle=cols[k%cols.length]; c.fillRect(x,y0,w,ch);
      c.fillStyle='#1a1f26';            c.fillRect(x,y0+ch-1,w,1);
      c.fillStyle='#6b7482';            c.fillRect(x,y0,w,1);
      var off=(k%2)?12:5;
      for(var j=off;j<w;j+=16) c.fillStyle='#1a1f26', c.fillRect(x+j,y0+1,1,ch-2);
    }
  }

  /* ============================================================
     光：像素里的"发光"是硬边色阶堆出来的
     ------------------------------------------------------------
     之前每一盏灯只在灯罩旁边贴一块 rgba(255,176,59,.09) 的矩形。
     那不是光，那是一块半透明的色斑——边缘和背后的墙一样硬，亮度只有一档。

     修成"真的在发光"时先试了实心十字臂、又被否成菱形描边环，两版都是
     在灯四周画一圈东西，结果两个都不行：
       实心十字臂  一根黄杠横穿画面，把 z0 的窗户整个盖掉
       菱形描边环  一圈闭合的线挂在画面上，边缘又直又长，读成"贴了张图"
     光晕这一层整个删掉。现在靠三样东西表达"在发光"，全都不画圈：
       1 亮芯   灯罩里那一小块纯暖色，画面上最亮的点
       2 光柱   灯罩往下的一段硬边梯形，空气里被照亮的那一柱
       3 光池   地面上一个椭圆形的受光区，硬边两档
     三样都是"从一个点往别处走"的东西，没有一样是围着点转圈的，
     所以画面读出来是"这里有个东西在照"，而不是"这里画了个图形"。 */
  var LITH={core:'#fff6dc', hot:'#ffe0a0', warm:'#f0b45c', mid:'#a06f2e', dim:'#6b4a20', faint:'#4a3418'};
  /* 光柱：灯罩往下的一段硬边梯形。逐行收窄，每行一个整数宽度，
     所以边是斜的、硬的，不是渐变 */
  function shaft(cx,y0,y1,w,colTop,colBot){
    var hgt=y1-y0;
    for(var i=0;i<hgt;i++){
      var hw=Math.max(1,Math.round(w*(1-i/hgt)));
      c.fillStyle=(i<hgt*0.35)?colTop:colBot;
      c.fillRect(cx-hw,y0+i,hw*2,1);
    }
  }
  /* 4 光池。中心必须真的比它落上去的地面亮——第一版中心给的是 #4a4028
     （亮度 64），人行道受光唇是 #454d58（亮度 76），探针一测就露馅：
     灯脚下的地面比没灯的地方还暗，光的方向整个是反的。
     灯下的地是被照亮的斑，它得压过任何一种路面材质 */
  function pool(cx,cy,rx,ry,cIn,cOut){
    for(var i=-ry;i<=ry;i++){
      var t=1-(i*i)/(ry*ry); if(t<=0) continue;
      var hw=Math.round(rx*Math.sqrt(t));
      c.fillStyle=(Math.abs(i)>ry*0.45)?cOut:cIn;
      c.fillRect(cx-hw,cy+i,hw*2+1,1);
    }
  }
  /* 一盏灯。col 决定灯罩和柱子的配色（街上是暖钠灯、桥上是冷白灯、
     前景是近黑剪影），但发光的部分对所有灯都是同一套——光源就是光源 */
  function lamp(x,gy,h,o){
    o=o||{};
    var sw=o.sw||14, arm=o.arm||0;         /* arm: 悬臂往左伸几格 */
    var cx=x+2, ty=gy-h;                 /* 灯罩顶 */
    var r=o.r||30;
    /* 1 亮芯：画面上最亮的一个点 */
    c.fillStyle=LITH.core; c.fillRect(cx-2,ty+2,4,2);
    /* 2 光柱：从灯罩往下，越来越窄 */
    shaft(cx,ty+5,gy-2,o.sw2||9,'rgba(255,208,130,0.10)','rgba(255,196,110,0.05)');
    /* 柱 */
    c.fillStyle=o.col||'#241f2c'; c.fillRect(cx-2,ty+5,4,gy-ty-5);
    c.fillStyle=o.col2||'#3a3348'; c.fillRect(cx-2,ty+5,1,gy-ty-5);
    c.fillStyle=o.col; c.fillRect(cx-3,gy-3,6,3);          /* 柱脚 */
    c.fillStyle=o.col2; c.fillRect(cx-3,gy-3,6,1);
    /* 悬臂 */
    if(arm>0){
      c.fillStyle=o.col; c.fillRect(cx-2-arm,ty+3,arm+3,3);
      c.fillStyle=o.col2; c.fillRect(cx-2-arm,ty+3,arm+3,1);
    }
    /* 灯罩：上宽下窄的一格台阶，底下那格是灯芯 */
    c.fillStyle=o.col; c.fillRect(cx-sw/2,ty,sw,5);
    c.fillStyle=o.col2; c.fillRect(cx-sw/2,ty,sw,1);
    c.fillStyle=o.col; c.fillRect(cx-sw/2+2,ty+5,sw-4,2);
    c.fillStyle=LITH.core; c.fillRect(cx-sw/2+2,ty+2,sw-4,2);
    c.fillStyle=LITH.hot;  c.fillRect(cx-sw/2+3,ty+2,sw-6,1);
    /* 3 光池 */
    pool(cx,gy+1,Math.round(r*0.95),Math.max(4,Math.round(r*0.26)),
         o.pIn||'#6a5f3c', o.pOut||'#45402c');
  }
  /* 小屋的窗光：窗是全画面唯一的强光源，所以它比路灯多一柱——
     从窗口一路投到地面的光柱，和沿墙根一格一格递出去的光带。
     光带必须是一行比一行窄的短条，填一个长矩形的话它读成"墙底刷了黄漆" */
  function windowLight(cx,wy,gy,w){
    shaft(cx,wy+4,gy-2,Math.round(w*0.7),'rgba(255,208,130,0.11)','rgba(255,196,110,0.06)');
    pool(cx,gy+1,Math.round(w*1.6),6,'#6d5a32','#453a26');
    for(var i=0;i<5;i++){
      var ww=Math.round(w*1.8*(1-i/5.6));
      c.fillStyle=i<2?'#5a4626':(i<4?'#3e3320':'#2a2519');
      c.fillRect(cx-ww,gy+3+i,ww*2,1);
    }
  }

  /* ============================================================
     三段过渡带：脚下那条路已经在上面铺完了，这里处理的是【路两旁】
     ------------------------------------------------------------
     之前这三段做的全是"地面"：草皮→土路→人行道→碎石→桥台→木栈道，
     一段一种材质，接缝处压边、加唇、补土层，改了两轮都还是三块贴图。
     这次脚下不动了——路面是一整条连续的，材质在里面咬合着换。
     那么"过渡"从哪儿读出来？读两旁。
     三段各有一样东西在完成交接：家变成街、街变成桥、桥变成岸。
     猫巡逻时只在每个区的头尾 570 格内来回（lo=70, hi=SCENE_W-70），
     根本不会进过渡带——所以过渡带里放手放高物件，被挡住的只会是
     主动跑过去的那几秒，不会挡掉常态画面里的主角。 */

  /* T1 院子 → 街（640 → 960）：家在这一段收尾。
     院墙推到 790 就断，两棵剪过的路树接上，一对门柱当门槛。
     门柱是这一段的主角：猫跨过它，"家"就在身后了。 */
  (function(){
    var a=SCENE_W, b=ZONE_W;
    /* 院墙：接在篱笆后面，墙头压一排瓦 */
    c.fillStyle='#4a453c'; c.fillRect(a,GROUND-22,150,22);
    c.fillStyle='#5f584b'; c.fillRect(a,GROUND-22,150,2);
    c.fillStyle='#2e2b26'; c.fillRect(a,GROUND-20,150,1);
    c.fillStyle='#3d392f';
    for(i=0;i<150;i+=11) c.fillRect(a+i,GROUND-20,1,20);
    c.fillStyle='#3a2a1c'; c.fillRect(a-4,GROUND-27,158,5);
    c.fillStyle='#54392a'; c.fillRect(a-4,GROUND-27,158,1);
    c.fillStyle='#241f19'; c.fillRect(a-4,GROUND-23,158,1);
    /* 墙头探出来的两丛草：院墙到这里就停了，草还长了一会儿 */
    c.fillStyle='#1b3129';
    for(i=0;i<5;i++) c.fillRect(a+14+i*13,GROUND-30-((i*7)%3),7,4);
    /* 剪过的路树：脚下一圈土，树冠剪成方的——和院里的树不一样，
       一眼就看得出"这已经是街上种的那种了" */
    [a+72, a+268, b-96].forEach(function(tx){
      c.fillStyle='#3a3226'; c.fillRect(tx-12,GROUND-4,24,4);
      c.fillStyle='#4d4232'; c.fillRect(tx-12,GROUND-4,24,1);
      c.fillStyle='#3a2418'; c.fillRect(tx-2,GROUND-24,4,20);
