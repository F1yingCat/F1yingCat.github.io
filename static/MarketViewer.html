<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Market Viewer</title>
<!-- 不再做 zoom 适配(测试发现 body/documentElement zoom 在切页后会导致 grid 跑版) -->
<!-- 建议:Chrome 浏览器缩放改 100%(治本) — Windows 150% DPI 缩放下不会"挤" -->
<script>
  // 切页/窗口变化时强制 ECharts resize + 关闭 popover
  // (即使没 zoom,切页后内容重渲染,popover 位置可能错)
  window.addEventListener('resize', function() {
    setTimeout(function() {
      try {
        if (typeof resizeAllCharts === 'function') resizeAllCharts();
      } catch(e) {}
    }, 200);
  });
</script>
<script src="assets/echarts.min.js"></script>
<style>
  :root{
    /* Light theme (default) */
    --bg:#eef1f5; --card:#ffffff; --ink:#1f2937; --sub:#6b7280; --muted:#9ca3af;
    --up:#e23c3c; --down:#1a9e57; --line:#e5e7eb; --line-soft:#eef0f3;
    --accent:#2f5fd0; --accent-soft:#e8eefb;
    --warn:#e8973c; --danger:#e23c3c;
    --source-ok:#1a9e57; --source-fallback:#e8973c;
    --header-grad-a:#2f5fd0; --header-grad-b:#3f7be0;
    --float-bg:rgba(255,255,255,.92); --float-border:#e5e7eb;
    /* 响应式断点变量(默认 = 1920 大屏基线) */
    --section-pad: 13px 15px;
    --chart-h: 250px;
    --kpi-val: 20px;
    --kpi-chg: 12.5px;
    --kpi-lbl: 13px;
    --kpi-min: 115px;
    --table-size: 14px;
    --h2-size: 15.5px;
    --wrap-pad: 60px 24px 24px;
    --content-max-w: none;  /* 大屏不加 max-width,完全展开 */
  }
  [data-theme="dark"]{
    --bg:#0a0e16; --card:#131927; --ink:#e6ebf2; --sub:#9aa6b8; --muted:#6b7587;
    --up:#ff5c5c; --down:#2ed47e; --line:#1f2638; --line-soft:#1a2030;
    --accent:#5b8af0; --accent-soft:#1a2540;
    --warn:#f5b556; --danger:#ff5c5c;
    --source-ok:#2ed47e; --source-fallback:#f5b556;
    --header-grad-a:#1d3a8a; --header-grad-b:#2f5fd0;
    --float-bg:rgba(11,15,23,.92); --float-border:#1f2638;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{background:var(--bg);}
  body{margin:0;color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    line-height:1.5;
    transition:background-color .25s ease, color .25s ease;
  }
  .val, td, .kpi .val, .kpi .chg, .up, .down, .flat { font-variant-numeric: tabular-nums; }

  /* ===== Floating control cards (top-left / top-right) ===== */
  .floating-tabs, .floating-meta{
    position:fixed; z-index:100;
    background:var(--float-bg); backdrop-filter:saturate(180%) blur(14px);
    -webkit-backdrop-filter:saturate(180%) blur(14px);
    border:1px solid var(--float-border);
    box-shadow:0 4px 18px -6px rgba(0,0,0,.18);
    border-radius:10px;
    /* 浮窗最大宽度 = 视口 - 左右各 12px 边距,避免文字溢出到屏幕外 */
    max-width:calc(100vw - 24px);
    min-width:0;  /* 防止 flex/grid 撑大 */
  }
  .floating-tabs{ top:12px; left:12px; padding:3px; display:none; max-width:min(calc(100vw - 24px), 360px); overflow:hidden; }
  .floating-meta{ top:12px; right:12px; padding:5px 9px; display:none; gap:6px; align-items:center; font-size:11.5px; color:var(--sub); overflow:hidden; }
  .floating-meta .updated{ font-variant-numeric: tabular-nums; max-width:140px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .floating-tabs button{
    border:none; background:transparent;
    padding:5px 10px; font-size:12px; font-weight:600;
    color:var(--sub); border-radius:7px; cursor:pointer;
    transition:all .15s; font-family:inherit;
    display:inline-flex; align-items:center; gap:4px;
    white-space:nowrap;  /* 防止 tab 文字被截断换行撑高浮窗 */
  }
  .floating-tabs button:hover{ background:var(--accent-soft); color:var(--ink); }
  .floating-tabs button.active{ background:var(--accent); color:#fff; }
  .floating-tabs .ico{ font-size:13px; }
  .floating-tabs .brand-dot{
    width:22px; height:22px; border-radius:6px;
    background:linear-gradient(135deg,var(--header-grad-a),var(--header-grad-b));
    display:inline-flex; align-items:center; justify-content:center;
    color:#fff; font-size:12px; margin-right:4px;
  }
  .floating-tabs .divider{ width:1px; background:var(--float-border); margin:4px 2px; }
  .theme-toggle{
    border:1px solid var(--line); background:transparent;
    color:var(--ink); width:24px; height:24px; border-radius:6px;
    cursor:pointer; display:inline-flex; align-items:center; justify-content:center;
    font-size:12px; transition:all .15s;
  }
  .theme-toggle:hover{ background:var(--accent-soft); border-color:var(--accent); }

  /* ===== Mobile inline tabs (always shown on mobile, hidden on desktop) ===== */
  .mobile-tabs{
    display:flex; background:var(--card); border-radius:12px; padding:4px;
    margin-bottom:14px; box-shadow:0 1px 3px rgba(0,0,0,.05);
    gap:4px; position:sticky; top:8px; z-index:10;
  }
  .mobile-tabs button{
    flex:1; border:none; background:transparent; padding:10px 6px;
    font-size:13px; font-weight:600; color:var(--sub); border-radius:9px;
    cursor:pointer; transition:all .15s; font-family:inherit; line-height:1.2;
  }
  .mobile-tabs button.active{ background:var(--accent); color:#fff;
    box-shadow:0 1px 3px rgba(47,95,208,.3); }
  .mobile-tabs button:hover:not(.active){ background:#f8fafc; }
  .mobile-tabs .ico{ display:block; font-size:16px; margin-bottom:2px; }

  /* ===== Main wrap (mobile default) ===== */
  .wrap{max-width:480px;margin:0 auto;padding:14px 12px 44px;}

  /* ===== Hero header (gradient card) ===== */
  header.top{
    background:linear-gradient(135deg,var(--header-grad-a),var(--header-grad-b));
    color:#fff; border-radius:12px; padding:14px 18px; margin-bottom:10px;
    box-shadow:0 4px 18px -8px rgba(47,95,208,.45);
  }
  header.top h1{margin:0 0 5px;font-size:19px;font-weight:700;line-height:1.3;}
  header.top p{margin:0;font-size:14px;opacity:.94;line-height:1.6;}
  header.top .tags-row{ display:flex; flex-wrap:wrap; gap:5px; margin-bottom:7px; }
  .tag{display:inline-block;background:rgba(255,255,255,.18);border-radius:5px;padding:2px 8px;font-size:12.5px;white-space:nowrap;}
  .tag-pop{cursor:pointer;transition:background .15s;}
  .tag-pop:hover{background:rgba(255,255,255,.32);}
  /* section 内的 tag-row:统一大小、完整显示、换行(白底深字) */
  section .tags-row{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 8px;align-items:flex-start;}
  section .tag{white-space:normal;line-height:1.35;max-width:100%;
    background:var(--accent-soft);color:var(--accent);}

  /* ===== Sections ===== */
  section{
    background:var(--card); border-radius:10px; padding:13px 15px; margin-bottom:10px;
    box-shadow:0 1px 2px rgba(0,0,0,.04);
    border:1px solid var(--line-soft);
    transition:box-shadow .2s ease, transform .2s ease;
    display:flex; flex-direction:column;  /* 让 popover-note 用 margin-top:auto 推到底 */
  }
  section:hover{box-shadow:0 4px 14px -4px rgba(0,0,0,.08);}
  section h2{margin:0 0 7px;font-size:15.5px;font-weight:700;display:flex;align-items:center;gap:6px;}
  section h2 .bar{width:3px;height:15px;background:var(--accent);border-radius:2px;display:inline-block;}

  .src{font-size:13px;color:var(--sub);margin:0 0 7px;line-height:1.5;}

  /* ===== Tables ===== */
  .table-wrap{ width:100%; overflow-x:auto; -webkit-overflow-scrolling:touch; }
  /* 横向可滚动的提示：左右两条"盖子"用 local,跟着内容一起滚,
     两端的阴影用 scroll,钉在容器上。能往右滚时右缘出现一条阴影,
     滚到头它自己消失 —— 不用 JS,也不改变任何盒模型尺寸。
     之前表格超宽时右半列直接被切掉,看上去像页面坏了,其实能滚,
     只是没人知道能滚。表头有实底,阴影只在透明的表体行上透出来。 */
  .table-wrap{
    background:
      linear-gradient(to right, var(--card) 40%, rgba(0,0,0,0)) left center,
      linear-gradient(to left,  var(--card) 40%, rgba(0,0,0,0)) right center,
      radial-gradient(farthest-side at 0 50%, rgba(0,0,0,.16), rgba(0,0,0,0)) left center,
      radial-gradient(farthest-side at 100% 50%, rgba(0,0,0,.16), rgba(0,0,0,0)) right center;
    background-repeat:no-repeat;
    background-size:34px 100%, 34px 100%, 13px 100%, 13px 100%;
    background-attachment:local, local, scroll, scroll;
  }
  /* td/th 不换行,表格按内容自然变宽,table-wrap 横向 scroll */
  .table-wrap table{ min-width: max-content; }
  .table-wrap td{ white-space:nowrap; }
  .table-wrap th{ white-space:nowrap; }  /* 表头也 nowrap */
  /* 标记 wrap class 的列允许换行(用于标的 / 合约代码+名字 / 事件 等长文本)
     max-width 限制 + word-break 让长文字真换行(避免单行装下就不换)
     vertical-align: top 让短内容贴顶,不被 row stretch 居中显出"空行"
     padding 显式重置 7px 10px:避免被页面 .wrap{ padding: 60px 24px 24px } 撑高 td */
  .table-wrap td.wrap, .table-wrap th.wrap{
    white-space:normal; word-break:break-all;
    max-width: 260px;          /* 列内容宽,长文字强制换行 */
    vertical-align: top;
    padding: 7px 10px;
  }
  /* 短 wrap 列(事件等):更窄 max-width,让长文字多换几行 */
  .table-wrap td.wrap-tight, .table-wrap th.wrap-tight{
    white-space:normal; word-break:break-all;
    max-width: 200px;
    vertical-align: top;
    padding: 7px 10px;
  }
  /* section.text-left:整张表全部贴左(标题 + 内容) */
  section.text-left .table-wrap th,
  section.text-left .table-wrap td{ text-align:left; }
  /* 合约名次行(代码加粗 + 名字常规) */
  .table-wrap .contract-name{ font-size:11px; color:var(--sub); }
  /* 不强制 min-width,让 grid 1fr 生效(否则表格会撑开 section 卡片) */
  table{width:100%;border-collapse:collapse;font-size:14.5px;border-spacing:0;
    table-layout:auto;}
  thead th{
    background:#f6f8fb; color:#4b5563; font-weight:600; font-size:13.5px;
    text-transform:uppercase; letter-spacing:.03em;
    padding:9px 10px; text-align:right; border-bottom:1.5px solid var(--line);
    position:sticky; top:0; z-index:1; white-space:nowrap;
  }
  [data-theme="dark"] thead th{background:#0f1420; color:#9aa6b8;}
  thead th:first-child, thead th.text-left{ text-align:left; }
  th,td{padding:7px 10px;text-align:right;border-bottom:1px solid var(--line-soft);
    vertical-align:top;}    /* 顶部对齐,wrap 列短内容跟数字列同行不偏移 */
  th:first-child,td:first-child{text-align:left;}
  tbody tr:nth-child(even){ background:rgba(0,0,0,.012); }
  [data-theme="dark"] tbody tr:nth-child(even){ background:rgba(255,255,255,.018); }
  tbody tr{transition:background-color .12s ease;}
  tbody tr:hover{background:var(--accent-soft);}
  tbody tr:last-child td{border-bottom:none;}

  .up{color:var(--up);font-weight:600;}
  .down{color:var(--down);font-weight:600;}
  .flat{color:var(--sub);font-weight:600;}
  .code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:var(--sub);}
  .col-code{display:none;}
  .pill{display:inline-block;padding:2px 8px;border-radius:9px;font-size:13px;font-weight:600;letter-spacing:.02em;}
  .pill.breach{background:#fde8e8;color:var(--danger);}
  [data-theme="dark"] .pill.breach{background:rgba(255,92,92,.15);color:var(--danger);}
  .pill.near{background:#fef3e2;color:var(--warn);}
  [data-theme="dark"] .pill.near{background:rgba(245,181,86,.15);color:var(--warn);}
  .pill.ok{background:#e8f6ee;color:var(--down);}
  [data-theme="dark"] .pill.ok{background:rgba(46,212,126,.15);color:var(--down);}
  .srcfallback{color:var(--source-fallback);font-weight:600;}
  .source-ok{color:var(--source-ok);font-weight:600;}

  .chart{width:100%;height:200px;}

  /* Note: popover 浮窗 — 点击按钮在**上方**弹出,点别处自动关闭 */
  .popover-note{ margin-top:auto; padding-top:8px; position:relative; z-index:99999; isolation:isolate; }
  .popover-trigger{
    width:100%; box-sizing:border-box;
    background:var(--accent-soft); border:1px solid transparent; border-radius:6px;
    padding:7px 11px; font-size:12.5px; color:var(--accent);
    cursor:pointer; font-family:inherit; font-weight:500;
    display:flex; align-items:center; justify-content:center; gap:6px;
    transition:background .15s, border-color .15s, color .15s;
  }
  .popover-trigger:hover{ background:var(--accent); color:#fff; border-color:var(--accent); }
  .popover-trigger::before{
    content:""; display:inline-block; width:13px; height:13px; flex:0 0 13px;
    background:currentColor;
    -webkit-mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z' fill='black'/></svg>") center/contain no-repeat;
            mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z' fill='black'/></svg>") center/contain no-repeat;
  }
  .popover-trigger::after{
    content:"详情 / 解读"; font-weight:500;
  }
  .popover-note.open .popover-trigger{ background:var(--accent); color:#fff; border-color:var(--accent); }
  /* 关注度 ★ 字符:按数量分级染色 + 加大,避免字体重叠导致颜色不一致 */
  .stars-5{ color:#dc2626; font-size:14px; letter-spacing:1px; font-weight:600; }
  .stars-4{ color:#ea580c; font-size:13px; letter-spacing:1px; }
  .stars-3{ color:#ca8a04; font-size:12.5px; letter-spacing:1px; }
  .stars-low{ color:var(--muted); font-size:12px; }
  /* ★ 数量 > 3 时拆 2 行:PC 端隐藏 br 保持单行(避免破坏布局),移动端强制换行 */
  .star-break{ display: none; }
  @media (max-width: 599px) {
    .star-break{ display: block; margin-top:2px; }  /* 移动:换行,带 2px 间距 */
  }

  /* 事件型 KPI 卡片(postmarket 六段 明日起/下周关注)— grid auto-fill 自适应事件数量 */
  .event-kpi-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(220px, 1fr));
    gap:10px;
    margin-top:8px;
  }
  .event-kpi{
    padding:12px 14px;
    background:var(--card-bg, #fff);
    border:1px solid var(--line);
    border-radius:8px;
    cursor:pointer;
    transition:all .15s ease;
    display:flex; flex-direction:column;
    min-height:90px;
  }
  [data-theme="dark"] .event-kpi{ background:#0f1420; }
  .event-kpi:hover{
    border-color:var(--accent);
    transform:translateY(-1px);
    box-shadow:0 4px 10px rgba(0,0,0,.06);
  }
  /* 第 1 行:★ 关注度 + 事件 */
  .event-kpi-head{
    display:flex; align-items:flex-start; gap:6px; margin-bottom:6px;
  }
  .event-kpi-title{
    font-size:13.5px; line-height:1.45; color:var(--ink); font-weight:500;
    flex:1; min-width:0;
    /* 多行换行,长事件名 2-3 行内显示 */
  }
  /* 第 2 行:时间 */
  .event-kpi-time{
    font-size:12px; color:var(--sub); font-variant-numeric:tabular-nums;
    margin-top:auto;  /* 推到底部对齐 */
  }
  /* popover 内影响文字 */
  .event-kpi-time-pop{ margin-bottom:8px; padding-bottom:8px; border-bottom:1px dashed var(--line); }
  .impact-text{
    font-size:13px; line-height:1.7; color:var(--ink); font-weight:500;
  }
  .impact-text b{ font-weight:700; }
  .popover-body{
    position:fixed; z-index:99999;
    background:var(--bg); border:1px solid var(--line); border-radius:10px;
    padding:12px 14px; min-width:280px; max-width:520px;
    /* 限高 + 内部 scroll,避免长 popover 溢出屏幕(默认 60vh,
       JS 动态根据 trigger 位置调成 viewport 剩余空间) */
    max-height:60vh; overflow-y:auto; overflow-wrap:break-word;
    font-size:12.5px; line-height:1.65; color:var(--sub);
    box-shadow:0 8px 28px rgba(0,0,0,0.14), 0 2px 6px rgba(0,0,0,0.06);
    /* scrollbar 美化 */
    scrollbar-width:thin; scrollbar-color:#cbd5e1 transparent;
  }
  /* summary 展开按钮:header 末尾的"阅读全文"按钮(实色背景,显眼) */
  .summary-expand-wrap{
    display:flex; justify-content:flex-start; margin-top:14px;
  }
  .summary-expand{
    display:inline-flex; align-items:center; gap:4px;
    background:var(--accent); color:#fff;
    /* 蓝色 header 背景下:加白色描边让按钮更清晰可辨 */
    border:1.5px solid rgba(255,255,255,.55);
    border-radius:18px;
    font-size:12.5px; font-weight:600; letter-spacing:.02em;
    padding:7px 16px; cursor:pointer;
    transition:all .15s ease;
    box-shadow:0 2px 4px rgba(37,99,235,.18);
  }
  .summary-expand:hover{
    background:#1d4ed8; transform:translateY(-1px);
    box-shadow:0 4px 8px rgba(37,99,235,.28);
  }
  .summary-expand:active{ transform:translateY(0); }
  .popover-body::-webkit-scrollbar{ width:6px; }
  .popover-body::-webkit-scrollbar-thumb{ background:#cbd5e1; border-radius:3px; }
  [data-theme="dark"] .popover-body{ background:#0f1420; box-shadow:0 8px 28px rgba(0,0,0,0.5), 0 2px 6px rgba(0,0,0,0.3); }
  .popover-body[hidden]{ display:none; }
  .popover-body b{ color:var(--ink); font-weight:600; }
  .popover-body .src{ display:block; margin-bottom:8px; padding-bottom:8px; border-bottom:1px dashed var(--line); color:var(--muted); font-size:11.5px; }

  /* ===== KPI cards ===== */
  .kpi-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;margin-top:0;}
  .kpi{
    background:#f8fafc; border:1px solid var(--line); border-radius:8px;
    padding:10px 13px; transition:all .15s;
    display:flex; flex-direction:column;  /* chg 推到底部对齐 */
    /* min-height 统一所有 kpi 卡片高度,短 chg 留底部空白跟长 chg 卡片对齐 */
    min-height:118px;
    /* min-width: 0 让 grid 1fr 精确控制列宽(否则 chg 长文字撑开单列) */
    min-width:0;
  }
  [data-theme="dark"] .kpi{background:#0f1420;}
  .kpi:hover{border-color:var(--accent); transform:translateY(-1px);}
  .kpi .lbl{font-size:13px;color:var(--sub);line-height:1.3;}
  .kpi .val{font-size:20px;font-weight:700;margin-top:2px;letter-spacing:-.01em;}
  .kpi .chg{font-size:13px;line-height:1.4;
    /* chg 文字限 3 行(短 1 行 / 中 2 行 / 长 3 行),避免卡片被超长 chg 撑大 */
    display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical;
    overflow:hidden; text-overflow:ellipsis;
    margin-top:1px;
  }
  /* KPI 卡片可点击,hover 提示 */
  .kpi.kpi-pop{ cursor:pointer; }
  /* KPI popover 头部(label + value 一行) */
  .kpi-pop-head{
    display:flex; justify-content:space-between; align-items:baseline;
    margin-bottom:8px; padding-bottom:8px;
    border-bottom:1px dashed var(--line);
  }
  .kpi-pop-head .lbl{ font-size:12px; color:var(--muted); font-weight:500; }
  .kpi-pop-head .val{ font-size:15px; font-weight:600; color:var(--ink); font-variant-numeric:tabular-nums; }
  /* popover 内 chg:全部统一加粗黑色,▲/▼ 涨跌符号保留对应颜色 */
  .chg-pop{
    font-size:13px; line-height:1.65; color:var(--ink); font-weight:500;
  }
  .chg-pop b{ font-weight:700; }
  .chg-pop .up{ color:var(--up); font-weight:600; }   /* 涨符号保留红色 */
  .chg-pop .down{ color:var(--down); font-weight:600; } /* 跌符号保留绿色 */
  /* 事件 KPI popover 影响文字: ▲/▼ 也保留对应颜色 */
  .impact-text .up{ color:var(--up); font-weight:600; }
  .impact-text .down{ color:var(--down); font-weight:600; }

  footer{font-size:13px;color:var(--sub);text-align:center;padding:10px;}
  .legend{font-size:13px;color:var(--sub);margin:-2px 0 6px;}
  .load-error{padding:30px 16px;text-align:center;color:var(--danger);font-size:15px;}

  section{animation:fadeUp .3s ease both;}
  /* 不能用 transform — 会让 section 成为 fixed 定位的 containing block,导致内部 popover 定位错位 */
  @keyframes fadeUp{from{opacity:0;} to{opacity:1;}}

  /* ===================================================
     不许撑破视口的总闸门
     grid 的 1fr 轨道的 auto 最小尺寸 = 该列所有 grid item 的 min-content
     最大值。section 里只要有一处内容算出来很宽(长标签 / 不换行的数字 /
     -webkit-box clamp 的长文),整条轨道就被顶宽,section 跟着溢出,
     页面出现横向滚动条,视口右边一条内容被切掉。
     之前只有 `#content > section.span-2{min-width:0}`(600-1024 断点里),
     可 1fr 只有一列时【同列的每个 section 都在给这条轨道贡献 min-content】,
     一个没写 min-width:0 的就够把页面撑破 —— 实测 600px 整页溢出 64px。
     所以规则落在每一个 section 上,而不是只落在 span-2 上。 */
  #content > section{ min-width:0; }
  .event-kpi-grid > *{ min-width:0; }
  /* 任何 section 的直接子元素都不许比 section 宽 */
  #content > section > *{ min-width:0; max-width:100%; }

  /* =================================================== */
  /* ========== MOBILE: 列多表格压缩 + 横滑 ========== */
  /* =================================================== */
  @media (max-width: 599px) {
    /* 整体字号加大(原 13px → 15px)— 中等屏(471)看着不挤 */
    body{ font-size:15px; }
    .table-wrap table{ font-size:14px; }
    .table-wrap th, .table-wrap td{ padding:7px 9px; }
    .table-wrap thead th{ padding:8px 9px; font-size:12.5px; }
    /* section padding 加大(原 13px 15px → 16px 18px)— 内容呼吸感 */
    section{ padding:16px 18px; border-radius:10px; }
    section h2{ font-size:17px; }
    /* 移动端 tag:点击弹浮窗显示全文,tag 本身完整显示+换行 */
    header.top .tag{
      max-width:100%;
      white-space:normal;
      cursor:pointer;
      padding:7px 12px; font-size:13.5px;
    }
    /* 移动端 summary 展开按钮:居中、加大,方便点击 */
    .summary-expand-wrap{
      justify-content:center;
      margin-top:18px;
    }
    .summary-expand{
      font-size:14.5px; padding:11px 26px; border-radius:24px;
      box-shadow:0 3px 6px rgba(37,99,235,.22);
    }
    /* 移动端 popover:占满 viewport,内部 scroll */
    .popover-body{
      max-width:calc(100vw - 32px);
      max-height:calc(100vh - 80px);
      padding:14px 16px; font-size:14px;
    }
    /* KPI banner / card — 只管卡片外观;列数/间距统一由文件末尾的
       KPI STRIP LADDER 按分辨率给,这里不要再写列数(见那里的说明) */
    .kpi{ padding:12px 14px; min-height:90px; }
    .kpi .lbl{ font-size:14px; }
    .kpi .val{ font-size:21px; }
    .kpi .chg{ font-size:13.5px; line-height:1.5; }
    /* 移动端事件型 KPI:2 列网格 */
    .event-kpi-grid{ grid-template-columns:repeat(auto-fill, minmax(170px, 1fr)); gap:10px; }
    .event-kpi{ padding:13px 14px; min-height:90px; }
    .event-kpi-title{ font-size:13.5px; line-height:1.5; }
    .event-kpi-time{ font-size:12px; }
    /* chart 高度合理 */
    .chart.chart-line{ height:240px !important; }
    /* 浮动 nav */
    .floating-tabs{ font-size:13px; }
    .floating-tabs button{ padding:7px 12px; }
  }

  /* =================================================== */
  /* 中等屏移动设备适配(600-767px)— 鸿蒙 Mate 40 RS / iPad Mini / 折叠屏
     Mate 40 RS 物理分辨率 1344×2772 ppi 456, dpr ≈ 2.85 → CSS viewport ≈ 472 px(竖屏)/972(横屏)
     不依赖 pointer:coarse(鸿蒙浏览器可能识别为 fine),纯按 viewport width 判断
     1-col 网格 + 加大 padding + 字号比小手机大

     为什么上界是 767 而不是原来的 1024:这段原本写的是 600-1024,而下面
     另有一段 @media(min-width:768px) 的桌面基础样式。两段在 768-1024 重叠,
     而重叠区间里本段的规则几乎全被后面那段按「同特异性 + 源码在后」盖掉 ——
     section padding / h2 字号 / .kpi padding / .kpi .val / chart 高度 / 浮动 tab
     全部失效,.table-wrap table 则是本段特异性更高反过来压掉了 --table-size 变量。
     也就是说 600-1024 这个声明范围里,有一半是死代码。
     把上界收到 767,让「声明范围」等于「实际生效范围」,重叠彻底消失:
       ≤599   手机段   |  600-767 本段(平板竖屏/横屏)  |  ≥768 桌面段
     768 以上想调的值一律放到桌面段,不要再往本段加。 */
  /* =================================================== */
  @media (min-width: 600px) and (max-width: 767px) {
    /* 整体字号 +1.5px,易读 */
    body{ font-size:15.5px; }
    /* section padding 加大,内容呼吸感 */
    section{ padding:16px 18px; border-radius:12px; }
    section h2{ font-size:17px; margin-bottom:8px; }
    /* 1-col 网格:避免桌面 3-col 在移动屏过挤 */
    #content{ display:grid; grid-template-columns:minmax(0,1fr); gap:14px; }
    #content > section.span-2{grid-column:1; min-width:0; }
    /* KPI banner 的列数不在本段写,统一交给文件末尾的 KPI STRIP LADDER */
    .kpi{ padding:14px 16px; min-height:96px; }
    .kpi .lbl{ font-size:14.5px; }
    .kpi .val{ font-size:22px; }
    .kpi .chg{ font-size:14px; line-height:1.5; -webkit-line-clamp:4; }
    /* 表格:稍大字号 + padding */
    .table-wrap table{ font-size:13.5px; }
    .table-wrap th, .table-wrap td{ padding:8px 10px; }
    .table-wrap thead th{ padding:9px 10px; font-size:12px; }
    /* 折线图高度:见文件末尾 CHART HEIGHT LADDER。240px 与 768-991 同档,
       原来这里是 280px,导致 700px 平板的图比 900px 笔记本还高(反常) */
    .chart.chart-line{ height:240px !important; }
    /* event-kpi:2 列(原本 auto-fill 220px minmax 4 列,移动端 2 列) */
    .event-kpi-grid{ grid-template-columns:repeat(auto-fill, minmax(180px, 1fr)); gap:10px; }
    .event-kpi{ padding:14px 16px; min-height:96px; }
    .event-kpi-title{ font-size:14px; }
    .event-kpi-time{ font-size:12.5px; }
    /* 触摸目标加大:tag / popover-trigger / 按钮 */
    header.top .tag{ padding:7px 12px; font-size:13px; }
    .summary-expand{ font-size:14.5px; padding:11px 24px; }
    /* popover 全屏 */
    .popover-body{
      max-width:calc(100vw - 32px);
      max-height:calc(100vh - 60px);
      padding:14px 16px; font-size:13.5px;
    }
    /* 浮动 tab 字号加大 */
    .floating-tabs{ font-size:13px; }
    .floating-tabs button{ padding:7px 12px; }
  }

  /* =================================================== */
  /* ========== DESKTOP (>= 768px) ==================== */
  /* 基础桌面规则(768-1199 用基础值,大屏用 @media 覆盖) */
  /* =================================================== */
  @media (min-width: 768px) {
    .mobile-tabs{ display:none; }
    .floating-tabs{ display:flex; }
    .floating-meta{ display:flex; }

    /* Wrap: 默认 60px 20px 20px,大屏覆盖 */
    .wrap{max-width:var(--content-max-w); padding:var(--wrap-pad);}

    /* Hero: 紧凑 */
    header.top{
      padding:14px 20px; border-radius:12px; margin-bottom:12px;
    }
    header.top h1{font-size:21px; margin-bottom:6px;}
    header.top p{font-size:14px; line-height:1.65;}
    .tag{font-size:12.5px; padding:2px 10px;}

    /* KPI 卡片外观 + 段内非 banner 的 .kpi-row 基线(2 列)。
       banner(「一、盘前关键关注」这类 type:kpi 段)的列数按分辨率分档,
       见文件末尾 KPI STRIP LADDER —— 别在这里写,会被后面的 @media 顺序坑 */
    .kpi-row{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:8px; margin-top:0;}
    .kpi{padding:7px 10px;}
    .kpi .lbl{font-size:var(--kpi-lbl);}
    .kpi .val{font-size:var(--kpi-val);}
    .kpi .chg{font-size:var(--kpi-chg); line-height:1.4;}

    /* Content: 3-col grid 默认;992-1199 切 2-col 在下面覆盖
       默认 stretch 让同行 section 等高(用户要求等高卡片) */
    #content{
      display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:10px;
    }
    #content > .load-error{grid-column:1 / -1;}
    #content > section.span-2{grid-column:1 / -1;}
    /* Grid item 默认 min-width: auto,会被子内容撑开,导致 #content 横向滚动
       强制 min-width: 0 让 section 收缩到 grid 列宽 */
    #content > section{ min-width: 0; }

    /* Stack-pair: 两个 section 共享 1 col,内部 grid
       auto auto 让 row 高度 = 各自内容(不被拉伸),避免长内容溢出
       align-self: start 让 stack-pair 自身不被外层 grid stretch 拉高
       (否则 #content 默认 stretch 会把 stack-pair 拉到同行最高,内部 auto 也被平均拉伸 → 长内容溢出) */
    .stack-pair{
      display:grid; grid-template-rows:auto auto; gap:10px;
      grid-column: span 1;
      align-self: start;  /* 不被外层 #content stretch */
      min-width:0; min-height:0;
    }
    .stack-pair > section{
      min-width:0; min-height:0;
    }
    /* 不加 overflow:auto,让 popover 浮窗溢出可见 */

    /* Section 内部 */
    section{
      display:flex; flex-direction:column;
      padding:var(--section-pad); border-radius:10px; margin-bottom:0;
    }
    section h2{font-size:var(--h2-size); margin-bottom:5px; flex:0 0 auto;}
    section h2 .bar{width:3px; height:14px;}

    /* PC 表格(数字更大更清晰) */
    table{font-size:var(--table-size); flex:0 0 auto;}
    thead th{padding:7px 9px; font-size:13px;}
    th,td{padding:6px 9px;}

    /* has-chart: chart 高度从变量取 */
    section.has-chart > .body{
      display:flex; flex-direction:column; gap:8px;
      flex:1 1 auto; min-height:0;
    }
    section.has-chart > .body > .chart{
      height:var(--chart-h); flex:0 0 auto;
    }
    /* has-chart section 内的 popover-note 用 margin-top:auto 推到 .body 最底 */
    section.has-chart > .body > .popover-note{ margin-top:auto; }
    section.span-2 > .chart{
      flex:0 0 auto; min-height:0;
    }
    /* line chart 基准高度 320px(取所有 line chart 中最高的)。
       1200px 以下的分档、以及 1600-1919 的例外,统一见文件末尾
       CHART HEIGHT LADDER —— 这里不要再加 @media,加在这段里面会被
       外层 min-width:768px 卡住(原来的 max-width:767/479 两条就是这么变死代码的) */
    .chart.chart-line, .chart-line{
      height: 320px !important;
    }

    /* 非 has-chart section:把 note 推到底 */
    section:not(.has-chart) > details.note{
      margin-top:auto;
    }

    .chart{height:var(--chart-h);}
    .chart-title{font-size:12px;color:var(--sub);margin:6px 0 -4px;padding-left:4px;font-weight:500;}

    .note summary{ font-size:13px; padding:5px 11px; }
    .note-body{ font-size:13px; padding:0 11px 6px; }
    .note-body .src{ margin-bottom:5px; }
  }

  /* =================================================== */
  /* ========== BREAKPOINTS (Bootstrap 5 风格) ========= */
  /* 顺序从大到小(max-width 限定),min-width 优先级更具体 */
  /* =================================================== */

  /* 大屏 ≥1920: 内容居中,左右留白,不过散 */
  @media (min-width: 1920px) {
    /* 大屏容器限宽 1440(原 1800),让 3×3 KPI 卡 ~440(比 600 紧凑) */
    :root { --content-max-w: 1440px; }
  }

  /* 大屏 1600-1919: 已有样式,变量值已经是 1920 的 */
  @media (min-width: 1600px) and (max-width: 1919px) {
    :root {
      --wrap-pad: 60px 24px 24px;
      --section-pad: 13px 15px;
      --chart-h: 250px;
      --kpi-val: 20px;
      --kpi-chg: 12.5px;
      --kpi-lbl: 13px;
      --table-size: 14px;
      --h2-size: 15.5px;
    }
  }

  /* 1200-1399: 笔记本标准,3-col 压缩 */
  @media (min-width: 1200px) and (max-width: 1399px) {
    :root {
      --wrap-pad: 56px 18px 18px;
      --section-pad: 11px 13px;
      --chart-h: 220px;
      --kpi-val: 18px;
      --kpi-chg: 12px;
      --kpi-lbl: 12.5px;
      --kpi-min: 105px;
      --table-size: 13.5px;
      --h2-size: 15px;
    }
  }

  /* 992-1199: 小桌面,切 2-col + 压缩 */
  @media (min-width: 992px) and (max-width: 1199px) {
    :root {
      --wrap-pad: 50px 16px 16px;
      --section-pad: 10px 12px;
      --chart-h: 200px;
      --kpi-val: 17px;
      --kpi-chg: 11.5px;
      --kpi-lbl: 12px;
      --kpi-min: 100px;
      --table-size: 13px;
      --h2-size: 14.5px;
    }
    /* 切 2-col: 外层 #content 改 2-col;KPI banner 2×3 由末尾的 LADDER 给 */
    #content{ grid-template-columns: repeat(2, minmax(0,1fr)); }
  }

  /* 768-991: 平板,2-col 更紧凑 */
  @media (min-width: 768px) and (max-width: 991px) {
    :root {
      --wrap-pad: 44px 14px 14px;
      --section-pad: 9px 11px;
      --chart-h: 180px;
      --kpi-val: 16px;
      --kpi-chg: 11px;
      --kpi-lbl: 11.5px;
      --kpi-min: 95px;
      --table-size: 12.5px;
      --h2-size: 14px;
    }
    #content{ grid-template-columns: repeat(2, minmax(0,1fr)); }
  }

  /* =================================================== */
  /* ===== RESPONSIVE LADDERS ==========================
     收在文件末尾、按断点单向覆盖的两张阶梯表。放在这里的唯一原因:
     散落在各段里的同选择器规则互相按「源码在后」覆盖,量过才知道有多处
     是死代码(见上面平板段和 768 段里被删掉的那几条)。要改档位只改这里。 */

  /* ----- KPI STRIP LADDER:banner 列数 -----
     「一、盘前关键关注」等 type:kpi 段 = 全宽 banner + 6 张卡。
     切点定在 1200px,跟全站其他东西对齐,不另立门户:
       - #content 正好是 1200px 从 2 列切到 3 列
       - --kpi-val 正好是 1200px 从 17px 切到 18px
     跟着 #content 走,横幅和下方 section 网格的列节奏就一致了。
       <1200px: 2 列 → 3 行 × 2 列
       ≥1200px: 3 列 → 2 行 × 3 列
     早先试过 1025px 当切点(那时 768-1024 被桌面段抢成 3 列,卡只剩 228px)。
     1025 那个数字是当时错误的产物,现在没有理由保留。 */
  @media (min-width: 1200px) {
    section.kpi-strip .kpi-row{
      grid-template-columns:repeat(3, minmax(0,1fr));
      gap:8px;
    }
  }
  @media (max-width: 1199px) {
    section.kpi-strip .kpi-row{
      grid-template-columns:repeat(2, minmax(0,1fr));
      gap:10px;
    }
  }

  /* ----- CHART HEIGHT LADDER:折线图高度 -----
     基准 320px 在 768 段里(取所有 line chart 里最高的那个),这里只收窄。
     档位刻意保持单调 —— 视口越宽,图越高:
       ≤599px   240px  (手机段)
       600-767  240px  (平板段,原来 280px,比 768-991 还高,反常)
       768-991  240px
       992-1199 260px
       1200-1399 280px
       ≥1400px  320px  (基准)
     原来 1600-1919 单独压到 300px,比它左边的 1400-1599(320px)还矮 ——
     视口更宽反而图更小,已删除,1600 以上统一走 320px。 */
  @media (min-width: 1200px) and (max-width: 1399px) { .chart.chart-line{ height:280px !important; } }
  @media (min-width: 992px)  and (max-width: 1199px) { .chart.chart-line{ height:260px !important; } }
  @media (min-width: 768px)  and (max-width: 991px)  { .chart.chart-line{ height:240px !important; } }
</style>
</head>
<body>

<!-- 桌面端浮动卡片:左上 tab 切换 + 右上时间戳/主题 -->
<aside class="floating-tabs" id="floating-tabs" aria-label="页面切换"></aside>
<aside class="floating-meta" id="floating-meta">
  <span class="updated" id="last-updated"></span>
  <button class="theme-toggle" id="theme-toggle" title="切换深色模式" aria-label="切换深色模式">🌙</button>
</aside>

<div class="wrap">

  <nav class="mobile-tabs" id="mobile-tabs" aria-label="页面切换"></nav>

  <header class="top" id="header"></header>

  <div id="content">
    <div class="load-error" id="loading">加载中…</div>
  </div>

  <footer id="footer"></footer>

</div>

<script src="assets/render.js"></script>
</body>
